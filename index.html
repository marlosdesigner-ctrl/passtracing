<!-- ======================================= -->
<!-- SHADER DE VÉRTICES                     -->
<!-- ======================================= -->

<script type="x-shader/x-vertex" id="vertexshader">
varying vec2 vUv;

void main() {
    vUv = uv;

    gl_Position =
        projectionMatrix *
        modelViewMatrix *
        vec4(position, 1.0);
}
</script>

<!-- ======================================= -->
<!-- SHADER DE FRAGMENTOS                   -->
<!-- ======================================= -->

<script type="x-shader/x-fragment" id="fragmentshader">
uniform sampler2D colorTexture;
uniform float opacity;

varying vec2 vUv;

float intensity(in vec4 color) {
    return sqrt(
        color.x * color.x +
        color.y * color.y +
        color.z * color.z
    );
}

void main() {
    ivec2 imageSize = textureSize(colorTexture, 0);

    vec2 stepSize = vec2(
        2.0 / float(imageSize.x),
        2.0 / float(imageSize.y)
    );

    float tl = intensity(texture2D(
        colorTexture,
        vUv + vec2(-stepSize.x, stepSize.y)
    ));

    float l = intensity(texture2D(
        colorTexture,
        vUv + vec2(-stepSize.x, 0.0)
    ));

    float bl = intensity(texture2D(
        colorTexture,
        vUv + vec2(-stepSize.x, -stepSize.y)
    ));

    float t = intensity(texture2D(
        colorTexture,
        vUv + vec2(0.0, stepSize.y)
    ));

    float b = intensity(texture2D(
        colorTexture,
        vUv + vec2(0.0, -stepSize.y)
    ));

    float tr = intensity(texture2D(
        colorTexture,
        vUv + vec2(stepSize.x, stepSize.y)
    ));

    float r = intensity(texture2D(
        colorTexture,
        vUv + vec2(stepSize.x, 0.0)
    ));

    float br = intensity(texture2D(
        colorTexture,
        vUv + vec2(stepSize.x, -stepSize.y)
    ));

    float horizontal =
        tl + 2.0 * l + bl -
        tr - 2.0 * r - br;

    float vertical =
        -tl - 2.0 * t - tr +
        bl + 2.0 * b + br;

    float edge = sqrt(
        horizontal * horizontal +
        vertical * vertical
    );

    vec4 edgeColor = vec4(
        1.0 - edge,
        1.0 - edge,
        1.0 - edge,
        edge
    );

    vec4 original = texture2D(
        colorTexture,
        vUv
    );

    float blend = smoothstep(
        0.0,
        0.3,
        opacity
    );

    gl_FragColor = vec4(
        original.rgb * blend +
        (1.0 - blend) * edgeColor.rgb,

        original.a * min(opacity, blend) +
        (1.0 - blend) * edgeColor.a
    );
}
</script>

<script type="module">

import * as THREE from "three";

import { OrbitControls }
from "three/addons/controls/OrbitControls.js";

import { ARButton }
from "three/addons/webxr/ARButton.js";

// ==========================================
// POITA - MURALOCK SYSTEM
// VERSÃO: FIXAR + ROTAÇÃO XYZ
//
// Base:
// Painel independente em Three.js.
//
// Nova função:
// Rotação nos eixos X, Y e Z.
//
// FIXAR/DESAFIXAR preservado.
// ==========================================

// ==========================================
// VARIÁVEIS PRINCIPAIS
// ==========================================

let container;
let camera;
let scene;
let renderer;

let controller1;
let controller2;

let clock;

let group = null;
let imagePlane = null;

let currentOpacity = 0.75;
let currentScale = 1.0;

let currentMode = "scale";

let imageFixed = false;

// ==========================================
// NOVAS VARIÁVEIS DE ROTAÇÃO
// ==========================================

let rotationAxis = "x";

// Velocidade em radianos por segundo.
// Aproximadamente 45,8 graus/segundo.

const rotationSpeed = 0.8;

// ==========================================
// INTERFACE
// ==========================================

let modePanel = null;
let menuHitArea = null;

const modeButtons = [];

let hoveredMode = null;

const uiRaycaster = new THREE.Raycaster();
const uiRayMatrix = new THREE.Matrix4();

const previousTriggerPressed = [
    false,
    false
];

let previousDidPressHideImage = false;

// ==========================================
// INICIALIZAÇÃO
// ==========================================

init();
animate();

function init() {

    container = document.getElementById(
        "container"
    );

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
        50,
        window.innerWidth / window.innerHeight,
        0.1,
        10
    );

    camera.position.set(0, 0, 1);

    const controls = new OrbitControls(
        camera,
        container
    );

    controls.minDistance = 0;
    controls.maxDistance = 8;

    clock = new THREE.Clock();

    renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
    });

    renderer.setPixelRatio(
        window.devicePixelRatio
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.localClippingEnabled = true;

    renderer.xr.enabled = true;
    renderer.xr.setFoveation(0);

    container.appendChild(
        renderer.domElement
    );

    // ======================================
    // CONTROLADORES
    // ======================================

    controller1 = renderer.xr.getController(0);
    controller2 = renderer.xr.getController(1);

    scene.add(controller1);
    scene.add(controller2);

    const rayGeometry =
        new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0, 0, -1)
        ]);

    const rayMaterial =
        new THREE.LineBasicMaterial({
            color: 0xffffff
        });

    const ray1 = new THREE.Line(
        rayGeometry,
        rayMaterial
    );

    ray1.scale.z = 3;
    controller1.add(ray1);

    const ray2 = ray1.clone();
    controller2.add(ray2);

    // ======================================
    // PAINEL
    // ======================================

    makeModeUI();

    // ======================================
    // GRUPO DA IMAGEM
    // ======================================

    group = new THREE.Group();

    group.position.set(
        0,
        0,
        -0.5
    );

    scene.add(group);

    loadTexture(
        group,
        0.25,
        "Images/discovery.jpg"
    );

    window.addEventListener(
        "resize",
        onWindowResize
    );

    setupHTMLInterface();
}

// ==========================================
// INTERFACE HTML
// ==========================================

function setupHTMLInterface() {

    const welcome =
        document.getElementById(
            "poitaWelcome"
        );

    const imageScreen =
        document.getElementById(
            "poitaImageScreen"
        );

    const readyScreen =
        document.getElementById(
            "poitaReadyScreen"
        );

    const imageInput =
        document.getElementById(
            "imageFileInput"
        );

    document.getElementById(
        "enterPoitaLink"
    ).onclick = function(event) {

        event.preventDefault();

        welcome.classList.add(
            "poitaHidden"
        );

        imageScreen.classList.remove(
            "poitaHidden"
        );
    };

    document.getElementById(
        "localImageLink"
    ).onclick = function(event) {

        event.preventDefault();

        imageInput.value = "";
        imageInput.click();
    };

    document.getElementById(
        "changePoitaImageLink"
    ).onclick = function(event) {

        event.preventDefault();

        imageInput.value = "";
        imageInput.click();
    };

    imageInput.onchange = handleLocalImage;

    document.getElementById(
        "startPoitaLink"
    ).onclick = function(event) {

        event.preventDefault();

        const button =
            document.getElementById(
                "ARButton"
            );

        if (button) {

            readyScreen.classList.add(
                "poitaHidden"
            );

            button.click();
        }
    };
}

// ==========================================
// PAINEL NATIVO THREE.JS
// ==========================================
//
// Mantemos o sistema que funcionou
// no Quest 2.
//
// Não usamos ThreeMeshUI.
// ==========================================

function makeModeUI() {

    modePanel = new THREE.Group();

    modePanel.position.set(
        0.0405,
        0.027,
        -0.0108
    );

    modePanel.scale.setScalar(0.27);

    controller1.add(modePanel);

    // Painel ligeiramente maior
    // para acomodar ROT X.

    const background = new THREE.Mesh(

        new THREE.PlaneGeometry(
            1.22,
            0.22
        ),

        new THREE.MeshBasicMaterial({
            color: 0x20252b,
            transparent: true,
            opacity: 0.94,
            side: THREE.DoubleSide,
            depthTest: false
        })
    );

    background.position.z = -0.003;
    background.renderOrder = 100;

    modePanel.add(background);

    // ======================================
    // ÁREA DE INTERAÇÃO
    // ======================================

    menuHitArea = new THREE.Mesh(

        new THREE.PlaneGeometry(
            1.25,
            0.25
        ),

        new THREE.MeshBasicMaterial({
            transparent: true,
            opacity: 0,
            side: THREE.DoubleSide,
            depthWrite: false,
            depthTest: false
        })
    );

    menuHitArea.position.z = 0.001;

    modePanel.add(menuHitArea);

    // ======================================
    // TÍTULO
    // ======================================

    const title = createCanvasLabel(
        "POITA  •  CONTROLE",
        1.10,
        0.060,
        34
    );

    title.position.set(
        0,
        0.063,
        0.004
    );

    modePanel.add(title);

    // ======================================
    // BOTÕES
    // ======================================

    const specs = [
        ["ESCALA", "scale", 0.155],
        ["X", "x", 0.155],
        ["Y", "y", 0.155],
        ["Z", "z", 0.155],
        ["ROT X", "rotate", 0.19],
        ["FIXAR", "fix", 0.22]
    ];

    const gap = 0.014;

    const total =
        specs.reduce(
            (sum, item) => sum + item[2],
            0
        ) +
        gap * (specs.length - 1);

    let x = -total / 2;

    for (const [label, mode, width] of specs) {

        const item = createModeButton(
            label,
            mode,
            width
        );

        item.object.position.set(
            x + width / 2,
            -0.035,
            0.006
        );

        modePanel.add(item.object);

        x += width + gap;
    }

    updateModeButtonVisuals();
}

// ==========================================
// TEXTOS DO PAINEL
// ==========================================

function createCanvasLabel(
    content,
    width,
    height,
    fontSize = 44
) {

    const canvas =
        document.createElement("canvas");

    canvas.width = 512;
    canvas.height = 128;

    const ctx = canvas.getContext("2d");

    const texture =
        new THREE.CanvasTexture(canvas);

    const material =
        new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            depthTest: false,
            depthWrite: false,
            side: THREE.DoubleSide
        });

    const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(
            width,
            height
        ),
        material
    );

    mesh.renderOrder = 103;

    mesh.userData.label = {
        canvas,
        ctx,
        texture,
        fontSize
    };

    drawCanvasLabel(
        mesh,
        content
    );

    return mesh;
}

function drawCanvasLabel(mesh, value) {

    if (
        mesh.userData.lastLabel === value
    ) {
        return;
    }

    const {
        canvas,
        ctx,
        texture,
        fontSize
    } = mesh.userData.label;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.font =
        "bold " + fontSize + "px Arial";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";

    ctx.fillText(
        value,
        canvas.width / 2,
        canvas.height / 2,
        canvas.width - 16
    );

    texture.needsUpdate = true;

    mesh.userData.lastLabel = value;
}

// ==========================================
// CRIAÇÃO DOS BOTÕES
// ==========================================

function createModeButton(
    label,
    mode,
    width
) {

    const holder = new THREE.Group();

    const background = new THREE.Mesh(

        new THREE.PlaneGeometry(
            width,
            0.075
        ),

        new THREE.MeshBasicMaterial({
            color: 0x404750,
            transparent: true,
            opacity: 1,
            depthTest: false,
            side: THREE.DoubleSide
        })
    );

    background.renderOrder = 101;

    holder.add(background);

    const fontSize =
        mode === "fix" ? 35 :
        mode === "rotate" ? 38 : 44;

    const textMesh = createCanvasLabel(
        label,
        width * 0.96,
        0.064,
        fontSize
    );

    textMesh.position.z = 0.002;

    holder.add(textMesh);

    const hitArea = new THREE.Mesh(

        new THREE.PlaneGeometry(
            width + 0.009,
            0.09
        ),

        new THREE.MeshBasicMaterial({
            transparent: true,
            opacity: 0,
            side: THREE.DoubleSide,
            depthWrite: false,
            depthTest: false
        })
    );

    hitArea.position.z = 0.009;

    holder.add(hitArea);

    const item = {
        object: holder,
        hitArea,
        textMesh,
        background,
        mode
    };

    modeButtons.push(item);

    return item;
}

// ==========================================
// ATUALIZAÇÃO VISUAL DOS BOTÕES
// ==========================================

function updateModeButtonVisuals() {

    for (const info of modeButtons) {

        const isFix =
            info.mode === "fix";

        let label;

        if (isFix) {

            label = imageFixed
                ? "DESAFIXAR"
                : "FIXAR";

        } else if (
            info.mode === "rotate"
        ) {

            label =
                "ROT " + rotationAxis.toUpperCase();

        } else if (
            info.mode === "scale"
        ) {

            label = "ESCALA";

        } else {

            label = info.mode.toUpperCase();
        }

        const color = isFix
            ? (
                imageFixed
                    ? 0x267d59
                    : 0xff8800
              )
            : imageFixed
                ? 0x404750
                : (
                    info.mode === currentMode ||
                    info.mode === hoveredMode
                        ? 0xff8800
                        : 0x404750
                  );

        const opacity =
            (!isFix && imageFixed)
                ? 0.25
                : 1;

        if (
            info.lastColor !== color
        ) {

            info.background.material.color.setHex(
                color
            );

            info.lastColor = color;
        }

        if (
            info.lastOpacity !== opacity
        ) {

            info.background.material.opacity =
                opacity;

            info.textMesh.material.opacity =
                opacity;

            info.lastOpacity = opacity;
        }

        drawCanvasLabel(
            info.textMesh,
            label
        );
    }
}

// ==========================================
// DETECÇÃO DOS BOTÕES
// ==========================================

function getHoveredModeButton(controller) {

    controller.updateMatrixWorld(true);

    if (modePanel) {
        modePanel.updateMatrixWorld(true);
    }

    uiRayMatrix.identity().extractRotation(
        controller.matrixWorld
    );

    uiRaycaster.ray.origin.setFromMatrixPosition(
        controller.matrixWorld
    );

    uiRaycaster.ray.direction
        .set(0, 0, -1)
        .applyMatrix4(uiRayMatrix)
        .normalize();

    let closestButton = null;
    let closestDistance = Infinity;

    for (const buttonInfo of modeButtons) {

        buttonInfo.hitArea.updateMatrixWorld(
            true
        );

        const intersections =
            uiRaycaster.intersectObject(
                buttonInfo.hitArea,
                false
            );

        if (
            intersections.length > 0 &&
            intersections[0].distance <
                closestDistance
        ) {

            closestDistance =
                intersections[0].distance;

            closestButton = buttonInfo;
        }
    }

    // FIXAR bloqueia os demais botões,
    // mas mantém DESAFIXAR acessível.

    if (
        imageFixed &&
        closestButton &&
        closestButton.mode !== "fix"
    ) {

        return null;
    }

    return closestButton;
}

function isPointerOverModePanel(controller) {

    if (
        !menuHitArea ||
        !modePanel
    ) {
        return false;
    }

    controller.updateMatrixWorld(true);
    modePanel.updateMatrixWorld(true);
    menuHitArea.updateMatrixWorld(true);

    uiRayMatrix.identity().extractRotation(
        controller.matrixWorld
    );

    uiRaycaster.ray.origin.setFromMatrixPosition(
        controller.matrixWorld
    );

    uiRaycaster.ray.direction
        .set(0, 0, -1)
        .applyMatrix4(uiRayMatrix)
        .normalize();

    const intersections =
        uiRaycaster.intersectObject(
            menuHitArea,
            false
        );

    return intersections.length > 0;
}

// ==========================================
// NOVA FUNÇÃO: SELECIONAR ROTAÇÃO
// ==========================================
//
// Primeiro clique:
// ROT X
//
// Segundo clique:
// ROT Y
//
// Terceiro clique:
// ROT Z
//
// Quarto clique:
// ROT X
// ==========================================

function selectRotationMode() {

    if (imageFixed) {
        return;
    }

    if (currentMode !== "rotate") {

        currentMode = "rotate";
        rotationAxis = "x";

    } else {

        if (rotationAxis === "x") {

            rotationAxis = "y";

        } else if (rotationAxis === "y") {

            rotationAxis = "z";

        } else {

            rotationAxis = "x";
        }
    }

    console.log(
        "POITA: ROT " +
        rotationAxis.toUpperCase()
    );
}

// ==========================================
// NOVA FUNÇÃO: GIRAR IMAGEM
// ==========================================
//
// A rotação ocorre sobre os eixos
// locais do grupo da imagem.
//
// FIXAR impede qualquer rotação.
// ==========================================

function rotateImage(delta) {

    if (
        imageFixed ||
        !group
    ) {
        return;
    }

    const angle =
        delta * rotationSpeed;

    if (rotationAxis === "x") {

        group.rotateX(angle);

    } else if (
        rotationAxis === "y"
    ) {

        group.rotateY(angle);

    } else if (
        rotationAxis === "z"
    ) {

        group.rotateZ(angle);
    }
}

// ==========================================
// ABRIR IMAGEM LOCAL
// ==========================================

function handleLocalImage(event) {

    const file =
        event.target.files[0];

    if (!file) {
        return;
    }

    if (
        !file.type.startsWith("image/")
    ) {

        alert(
            "O arquivo selecionado não é uma imagem."
        );

        return;
    }

    const url =
        URL.createObjectURL(file);

    document.getElementById(
        "poitaImagePreview"
    ).src = url;

    replaceImage(url);

    document.getElementById(
        "poitaImageScreen"
    ).classList.add(
        "poitaHidden"
    );

    document.getElementById(
        "poitaReadyScreen"
    ).classList.remove(
        "poitaHidden"
    );
}

// ==========================================
// TROCAR IMAGEM
// ==========================================

function replaceImage(url) {

    if (imagePlane) {

        group.remove(imagePlane);

        if (imagePlane.geometry) {
            imagePlane.geometry.dispose();
        }

        if (imagePlane.material) {

            const uniforms =
                imagePlane.material.uniforms;

            if (
                uniforms &&
                uniforms.colorTexture &&
                uniforms.colorTexture.value
            ) {

                uniforms.colorTexture.value.dispose();
            }

            imagePlane.material.dispose();
        }

        imagePlane = null;
    }

    loadTexture(
        group,
        0.25,
        url
    );
}

// ==========================================
// CARREGAR TEXTURA
// ==========================================

function loadTexture(target, length, url) {

    const loader =
        new THREE.TextureLoader();

    loader.load(

        url,

        function(texture) {

            if (
                document.getElementById(
                    "ARButton"
                ) === null
            ) {

                document.body.appendChild(
                    ARButton.createButton(
                        renderer
                    )
                );
            }

            const originalWidth =
                texture.image.width;

            const originalHeight =
                texture.image.height;

            const max = Math.max(
                originalWidth,
                originalHeight
            );

            const width =
                (originalWidth / max) *
                length;

            const height =
                (originalHeight / max) *
                length;

            const geometry =
                new THREE.PlaneGeometry(
                    width,
                    height
                );

            texture.generateMipmaps = false;

            const material =
                new THREE.ShaderMaterial({

                    transparent: true,

                    side: THREE.DoubleSide,

                    uniforms: {

                        colorTexture: {
                            value: texture
                        },

                        opacity: {
                            value: currentOpacity
                        }
                    },

                    vertexShader:
                        document.getElementById(
                            "vertexshader"
                        ).textContent,

                    fragmentShader:
                        document.getElementById(
                            "fragmentshader"
                        ).textContent
                });

            imagePlane = new THREE.Mesh(
                geometry,
                material
            );

            target.add(imagePlane);
        },

        undefined,

        function(error) {

            console.error(
                "Erro ao carregar imagem:",
                error
            );

            alert(
                "Não foi possível carregar a imagem."
            );
        }
    );
}

// ==========================================
// OPACIDADE
// ==========================================

function incrementOpacity(delta) {

    if (imageFixed) {
        return;
    }

    currentOpacity += delta;

    currentOpacity = Math.min(
        Math.max(currentOpacity, 0),
        1
    );

    if (imagePlane) {

        imagePlane.material.uniforms
            .opacity.value =
                currentOpacity;
    }
}

// ==========================================
// ESCALA
// ==========================================

function incrementScale(delta) {

    if (imageFixed) {
        return;
    }

    const scaleSpeed = Math.max(
        currentScale,
        1
    );

    currentScale +=
        delta * scaleSpeed;

    currentScale = Math.min(
        Math.max(currentScale, 0),
        40
    );

    if (group) {

        group.scale.set(
            currentScale,
            currentScale,
            currentScale
        );
    }
}

// ==========================================
// MOVIMENTAÇÃO X / Y / Z
// ==========================================

function moveImage(axis, delta) {

    if (
        imageFixed ||
        !group
    ) {
        return;
    }

    const moveSpeed = 0.35;

    const distance =
        delta * moveSpeed;

    if (axis === "x") {

        group.translateX(distance);

    } else if (axis === "y") {

        group.translateY(distance);

    } else if (axis === "z") {

        group.translateZ(distance);
    }
}

// ==========================================
// REDIMENSIONAMENTO
// ==========================================

function onWindowResize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}

// ==========================================
// LOOP PRINCIPAL WEBXR
// ==========================================
//
// FIXAR não interrompe este loop.
//
// O painel continua acompanhando
// o controlador.
//
// A imagem mantém suas transformações
// até ser desafixada.
// ==========================================

function animate() {

    renderer.setAnimationLoop(loop);
}

function loop() {

    if (modePanel) {

        modePanel.updateMatrixWorld(
            true
        );
    }

    updateInput();

    renderer.render(
        scene,
        camera
    );
}

// ==========================================
// ENTRADAS DOS CONTROLADORES
// ==========================================

function updateInput() {

    const session =
        renderer.xr.getSession();

    const dt =
        Math.min(clock.getDelta(), 0.05);

    hoveredMode = null;

    if (!session) {
        return;
    }

    let hideImagePressed = false;

    const sources =
        session.inputSources;

    for (
        let i = 0;
        i < sources.length;
        i++
    ) {

        const gamepad =
            sources[i].gamepad;

        if (
            !gamepad ||
            gamepad.mapping !== "xr-standard"
        ) {
            continue;
        }

        const controller =
            renderer.xr.getController(i);

        const trigger =
            gamepad.buttons[0];

        const axButton =
            gamepad.buttons[4];

        const triggerPressed =
            Boolean(
                trigger &&
                trigger.pressed
            );

        const justPressed =
            triggerPressed &&
            !previousTriggerPressed[i];

        const overPanel =
            isPointerOverModePanel(
                controller
            );

        const hoveredButton =
            getHoveredModeButton(
                controller
            );

        if (hoveredButton) {

            hoveredMode =
                hoveredButton.mode;
        }

        // ==================================
        // CLIQUES NA BARRA
        // ==================================

        if (
            justPressed &&
            hoveredButton
        ) {

            // FIXAR / DESAFIXAR

            if (
                hoveredButton.mode === "fix"
            ) {

                imageFixed = !imageFixed;

                console.log(
                    imageFixed
                        ? "POITA: IMAGEM FIXADA"
                        : "POITA: IMAGEM DESAFIXADA"
                );

            }

            // ROTAÇÃO X / Y / Z

            else if (
                !imageFixed &&
                hoveredButton.mode === "rotate"
            ) {

                selectRotationMode();

            }

            // ESCALA / X / Y / Z

            else if (!imageFixed) {

                currentMode =
                    hoveredButton.mode;

                console.log(
                    "POITA modo:",
                    currentMode
                );
            }
        }

        // ==================================
        // CONTROLES ANALÓGICOS
        // ==================================

        if (
            !imageFixed &&
            gamepad.axes.length >= 4
        ) {

            const horizontal =
                gamepad.axes[2];

            const vertical =
                gamepad.axes[3];

            // ==============================
            // ESCALA E OPACIDADE
            // ==============================

            if (
                currentMode === "scale"
            ) {

                if (vertical > 0.7) {

                    incrementScale(-dt);

                } else if (
                    vertical < -0.7
                ) {

                    incrementScale(dt);
                }

                if (horizontal > 0.7) {

                    incrementOpacity(dt);

                } else if (
                    horizontal < -0.7
                ) {

                    incrementOpacity(-dt);
                }
            }

            // ==============================
            // MOVIMENTAÇÃO X
            // ==============================

            else if (
                currentMode === "x"
            ) {

                if (horizontal > 0.25) {

                    moveImage("x", dt);

                } else if (
                    horizontal < -0.25
                ) {

                    moveImage("x", -dt);
                }
            }

            // ==============================
            // MOVIMENTAÇÃO Y
            // ==============================

            else if (
                currentMode === "y"
            ) {

                if (vertical < -0.25) {

                    moveImage("y", dt);

                } else if (
                    vertical > 0.25
                ) {

                    moveImage("y", -dt);
                }
            }

            // ==============================
            // MOVIMENTAÇÃO Z
            // ==============================

            else if (
                currentMode === "z"
            ) {

                if (vertical < -0.25) {

                    moveImage("z", -dt);

                } else if (
                    vertical > 0.25
                ) {

                    moveImage("z", dt);
                }
            }

            // ==============================
            // NOVO: ROTAÇÃO XYZ
            // ==============================
            //
            // Analógico horizontal:
            //
            // Direita = giro positivo
            // Esquerda = giro negativo
            //
            // O botão ROT seleciona
            // qual eixo será utilizado.
            // ==============================

            else if (
                currentMode === "rotate"
            ) {

                if (
                    Math.abs(horizontal) > 0.25
                ) {

                    rotateImage(
                        horizontal * dt
                    );
                }
            }
        }

        // ==================================
        // REPOSICIONAMENTO PELO GATILHO
        // ==================================
        //
        // Mantido como na versão validada.
        //
        // Não funciona com FIXAR ativo.
        // ==================================

        if (
            !imageFixed &&
            !overPanel &&
            triggerPressed &&
            group
        ) {

            controller.updateMatrixWorld(
                true
            );

            const offset =
                controller.localToWorld(
                    new THREE.Vector3(
                        0,
                        0,
                        -0.105
                    )
                );

            group.position.copy(
                offset
            );

            const worldQuaternion =
                new THREE.Quaternion();

            controller.getWorldQuaternion(
                worldQuaternion
            );

            group.setRotationFromQuaternion(
                worldQuaternion
            );
        }

        previousTriggerPressed[i] =
            triggerPressed;

        if (
            axButton &&
            axButton.pressed
        ) {

            hideImagePressed = true;
        }
    }

    // ==================================
    // ATUALIZAR PAINEL
    // ==================================

    updateModeButtonVisuals();

    // ==================================
    // MOSTRAR / OCULTAR IMAGEM
    // ==================================

    if (
        !hideImagePressed &&
        previousDidPressHideImage &&
        imagePlane
    ) {

        imagePlane.visible =
            !imagePlane.visible;
    }

    previousDidPressHideImage =
        hideImagePressed;
}

</script>
