
<!DOCTYPE html>

<head>

  <title>POITA - Muralock System</title>

  <style>

<body>

  <script async
    src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js">
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.147.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.147.0/examples/jsm/",
      "three-mesh-ui": "https://unpkg.com/three-mesh-ui@6.5.2/build/three-mesh-ui.module.js"
    }
  }
  </script>

  <!-- SHADER DE VÉRTICES -->

  <script type="x-shader/x-vertex" id="vertexshader">
    varying vec2 vUv;

    void main() {
      vUv = uv;
      gl_Position =
        projectionMatrix *
        modelViewMatrix *
        vec4(position, 1.0);
    }
  </script>

  <!-- SHADER DE FRAGMENTOS -->

  <script type="x-shader/x-fragment" id="fragmentshader">
    uniform sampler2D colorTexture;
    uniform float opacity;

    float stepSize = 2.0;
    varying vec2 vUv;

    float intensity(in vec4 color) {
      return sqrt(
        color.x * color.x +
        color.y * color.y +
        color.z * color.z
      );
    }

    void main() {
      vec2 uv = vUv;

      ivec2 imageSize = textureSize(colorTexture, 0);

      vec2 step = vec2(
        stepSize / float(imageSize.x),
        stepSize / float(imageSize.y)
      );

      float topLeft = intensity(
        texture2D(colorTexture, uv + vec2(-step.x, step.y))
      );

      float left = intensity(
        texture2D(colorTexture, uv + vec2(-step.x, 0.0))
      );

      float bottomLeft = intensity(
        texture2D(colorTexture, uv + vec2(-step.x, -step.y))
      );

      float top = intensity(
        texture2D(colorTexture, uv + vec2(0.0, step.y))
      );

      float bottom = intensity(
        texture2D(colorTexture, uv + vec2(0.0, -step.y))
      );

      float topRight = intensity(
        texture2D(colorTexture, uv + vec2(step.x, step.y))
      );

      float right = intensity(
        texture2D(colorTexture, uv + vec2(step.x, 0.0))
      );

      float bottomRight = intensity(
        texture2D(colorTexture, uv + vec2(step.x, -step.y))
      );

      float horizontal =
        topLeft + 2.0 * left + bottomLeft -
        topRight - 2.0 * right - bottomRight;

      float vertical =
        -topLeft - 2.0 * top - topRight +
        bottomLeft + 2.0 * bottom + bottomRight;

      float sobelResult = sqrt(
        horizontal * horizontal +
        vertical * vertical
      );

      vec4 sobelColor = vec4(
        1.0 - sobelResult,
        1.0 - sobelResult,
        1.0 - sobelResult,
        sobelResult
      );

      vec4 currentColor = texture2D(colorTexture, uv);

      float smoothOpacity =
        smoothstep(0.0, 0.3, opacity);

      gl_FragColor = vec4(
        currentColor.rgb * smoothOpacity +
        (1.0 - smoothOpacity) * sobelColor.rgb,

        currentColor.a * min(opacity, smoothOpacity) +
        (1.0 - smoothOpacity) * sobelColor.a
      );
    }
  </script>

  <script type="module">

    import * as THREE from "three";

    import { OrbitControls }
      from "three/addons/controls/OrbitControls.js";

    import { ARButton }
      from "three/addons/webxr/ARButton.js";

    import ThreeMeshUI from "three-mesh-ui";

    // ==========================================
    // VARIÁVEIS PRINCIPAIS
    // ==========================================

    let container;
    let camera;
    let scene;
    let renderer;

    let controller1;
    let controller2;
    let clock;

    let group = null;
    let imagePlane = null;

    let currentOpacity = 0.75;
    let currentScale = 1.0;

    let previousDidPressHideImage = false;

    let currentMode = "scale";

    // Estado exclusivo da imagem
    let imageFixed = false;

    let modePanel = null;
    let modeButtons = [];

    let menuHitArea = null;
    let hoveredMode = null;

    const uiRaycaster = new THREE.Raycaster();
    const uiRayMatrix = new THREE.Matrix4();

    const previousTriggerPressed = [false, false];

    // ==========================================
    // INICIALIZAÇÃO
    // ==========================================

    init();
    animate();

    function init() {

      container = document.getElementById("container");

      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(
        50,
        window.innerWidth / window.innerHeight,
        0.1,
        10
      );

      camera.position.set(0, 0, 1);

      const controls = new OrbitControls(
        camera,
        container
      );

      controls.minDistance = 0;
      controls.maxDistance = 8;

      clock = new THREE.Clock();

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
      });

      renderer.setPixelRatio(window.devicePixelRatio);

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.localClippingEnabled = true;

      renderer.xr.enabled = true;
      renderer.xr.setFoveation(0);

      container.appendChild(renderer.domElement);

      // ========================================
      // CONTROLADORES
      // ========================================

      controller1 = renderer.xr.getController(0);
      controller2 = renderer.xr.getController(1);

      scene.add(controller1);
      scene.add(controller2);

      const rayGeometry =
        new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(0, 0, -1)
        ]);

      const rayMaterial =
        new THREE.LineBasicMaterial({
          color: 0xffffff
        });

      const ray1 = new THREE.Line(
        rayGeometry,
        rayMaterial
      );

      ray1.scale.z = 3;
      controller1.add(ray1);

      const ray2 = ray1.clone();
      controller2.add(ray2);

      // Painel preso ao controlador 1
      makeModeUI();

      // ========================================
      // GRUPO DA IMAGEM
      // ========================================

      group = new THREE.Group();

      group.position.set(
        0,
        0,
        -0.5
      );

      scene.add(group);

      loadTexture(
        group,
        0.25,
        "Images/discovery.jpg"
      );

      window.addEventListener(
        "resize",
        onWindowResize
      );

      // ========================================
      // TELAS HTML
      // ========================================

      const enterPoitaLink =
        document.getElementById("enterPoitaLink");

      const poitaWelcome =
        document.getElementById("poitaWelcome");

      const poitaImageScreen =
        document.getElementById("poitaImageScreen");

      const poitaReadyScreen =
        document.getElementById("poitaReadyScreen");

      const startPoitaLink =
        document.getElementById("startPoitaLink");

      const localImageLink =
        document.getElementById("localImageLink");

      const changePoitaImageLink =
        document.getElementById("changePoitaImageLink");

      const imageFileInput =
        document.getElementById("imageFileInput");

      enterPoitaLink.onclick = function(event) {
        event.preventDefault();

        poitaWelcome.classList.add("poitaHidden");

        poitaImageScreen.classList.remove(
          "poitaHidden"
        );
      };

      localImageLink.onclick = function(event) {
        event.preventDefault();

        imageFileInput.value = "";
        imageFileInput.click();
      };

      imageFileInput.onchange = handleLocalImage;

      changePoitaImageLink.onclick = function(event) {
        event.preventDefault();

        imageFileInput.value = "";
        imageFileInput.click();
      };

      startPoitaLink.onclick = function(event) {
        event.preventDefault();

        const arButton =
          document.getElementById("ARButton");

        if (arButton) {
          poitaReadyScreen.classList.add(
            "poitaHidden"
          );

          arButton.click();
        }
      };
    }

    // ==========================================
    // CRIAÇÃO DO PAINEL DE CONTROLE
    // ==========================================

    function makeModeUI() {

      const fontFamily =
        "https://unpkg.com/three-mesh-ui@6.5.2/examples/assets/Roboto-msdf.json";

      const fontTexture =
        "https://unpkg.com/three-mesh-ui@6.5.2/examples/assets/Roboto-msdf.png";

      modePanel = new ThreeMeshUI.Block({
        width: 0.99,
        height: 0.22,
        padding: 0.025,
        contentDirection: "column",
        justifyContent: "center",
        alignContent: "center",
        borderRadius: 0.025,
        backgroundColor: new THREE.Color(0x20252b),
        backgroundOpacity: 0.90,
        fontFamily,
        fontTexture
      });

      modePanel.position.set(
        0.15,
        0.10,
        -0.04
      );

      modePanel.scale.set(
        0.27,
        0.27,
        0.27
      );

      menuHitArea = new THREE.Mesh(
        new THREE.PlaneGeometry(1.02, 0.25),
        new THREE.MeshBasicMaterial({
          transparent: true,
          opacity: 0,
          side: THREE.DoubleSide,
          depthWrite: false
        })
      );

      menuHitArea.position.z = 0.001;

      THREE.Object3D.prototype.add.call(
        modePanel,
        menuHitArea
      );

      const title = new ThreeMeshUI.Text({
        content: "POITA  •  CONTROLE",
        fontSize: 0.032,
        fontColor: new THREE.Color(0xffffff)
      });

      const buttonRow = new ThreeMeshUI.Block({
        width: 0.94,
        height: 0.10,
        margin: 0.015,
        contentDirection: "row",
        justifyContent: "center",
        alignContent: "center",
        backgroundOpacity: 0
      });

      buttonRow.add(
        createModeButton("ESCALA", "scale"),
        createModeButton("X", "x"),
        createModeButton("Y", "y"),
        createModeButton("Z", "z"),
        createModeButton("FIXAR", "fix")
      );

      modePanel.add(title, buttonRow);

      controller1.add(modePanel);

      updateModeButtonVisuals();
    }

    // ==========================================
    // CRIAÇÃO DOS BOTÕES
    // ==========================================

    function createModeButton(label, mode) {

      const width =
        mode === "fix" ? 0.22 : 0.155;

      const button = new ThreeMeshUI.Block({
        width,
        height: 0.075,
        margin: 0.008,
        justifyContent: "center",
        alignContent: "center",
        borderRadius: 0.015,
        backgroundColor: new THREE.Color(0x404750),
        backgroundOpacity: 1
      });

      const labelText = new ThreeMeshUI.Text({
        content: label,
        fontSize: mode === "fix" ? 0.023 : 0.027,
        fontColor: new THREE.Color(0xffffff)
      });

      button.add(labelText);

      const hitArea = new THREE.Mesh(
        new THREE.PlaneGeometry(
          width + 0.01,
          0.09
        ),
        new THREE.MeshBasicMaterial({
          transparent: true,
          opacity: 0,
          side: THREE.DoubleSide,
          depthWrite: false
        })
      );

      hitArea.position.z = 0.003;

      THREE.Object3D.prototype.add.call(
        button,
        hitArea
      );

      modeButtons.push({
        object: button,
        hitArea,
        text: labelText,
        mode
      });

      return button;
    }

    // ==========================================
    // CORREÇÃO: ATUALIZAÇÃO VISUAL DOS BOTÕES
    // ==========================================
    //
    // As propriedades só são reaplicadas
    // quando o estado visual realmente muda.
    //
    // FIXAR e DESAFIXAR permanecem acessíveis.
    // ==========================================

    function updateModeButtonVisuals() {

      for (const info of modeButtons) {

        const isFix = info.mode === "fix";

        const label = isFix
          ? (imageFixed ? "DESAFIXAR" : "FIXAR")
          : (
              info.mode === "scale"
                ? "ESCALA"
                : info.mode.toUpperCase()
            );

        const color = isFix
          ? (imageFixed ? 0x267d59 : 0xff8800)
          : imageFixed
            ? 0x404750
            : (
                info.mode === currentMode ||
                info.mode === hoveredMode
                  ? 0xff8800
                  : 0x404750
              );

        const opacity =
          (!isFix && imageFixed) ? 0.25 : 1;

        if (info.displayLabel !== label) {

          info.text.set({
            content: label
          });

          info.displayLabel = label;
        }

        if (
          info.lastColor !== color ||
          info.lastOpacity !== opacity
        ) {

          info.object.set({
            backgroundColor: new THREE.Color(color),
            backgroundOpacity: opacity
          });

          info.lastColor = color;
          info.lastOpacity = opacity;
        }
      }
    }

    // ==========================================
    // DETECÇÃO DOS BOTÕES PELO CONTROLADOR
    // ==========================================

    function getHoveredModeButton(controller) {

      controller.updateMatrixWorld(true);

      if (modePanel) {
        modePanel.updateMatrixWorld(true);
      }

      uiRayMatrix.identity().extractRotation(
        controller.matrixWorld
      );

      uiRaycaster.ray.origin.setFromMatrixPosition(
        controller.matrixWorld
      );

      uiRaycaster.ray.direction
        .set(0, 0, -1)
        .applyMatrix4(uiRayMatrix)
        .normalize();

      let closestButton = null;
      let closestDistance = Infinity;

      for (const buttonInfo of modeButtons) {

        buttonInfo.hitArea.updateMatrixWorld(true);

        const intersections =
          uiRaycaster.intersectObject(
            buttonInfo.hitArea,
            false
          );

        if (
          intersections.length > 0 &&
          intersections[0].distance < closestDistance
        ) {

          closestDistance =
            intersections[0].distance;

          closestButton = buttonInfo;
        }
      }

      // Com a imagem fixada, apenas
      // DESAFIXAR pode receber clique.

      if (
        imageFixed &&
        closestButton &&
        closestButton.mode !== "fix"
      ) {
        return null;
      }

      return closestButton;
    }

    function isPointerOverModePanel(controller) {

      if (!menuHitArea || !modePanel) {
        return false;
      }

      controller.updateMatrixWorld(true);
      modePanel.updateMatrixWorld(true);
      menuHitArea.updateMatrixWorld(true);

      uiRayMatrix.identity().extractRotation(
        controller.matrixWorld
      );

      uiRaycaster.ray.origin.setFromMatrixPosition(
        controller.matrixWorld
      );

      uiRaycaster.ray.direction
        .set(0, 0, -1)
        .applyMatrix4(uiRayMatrix)
        .normalize();

      const intersections =
        uiRaycaster.intersectObject(
          menuHitArea,
          false
        );

      return intersections.length > 0;
    }

    // ==========================================
    // ABRIR IMAGEM LOCAL
    // ==========================================

    function handleLocalImage(event) {

      const file = event.target.files[0];

      if (!file) {
        return;
      }

      if (!file.type.startsWith("image/")) {
        alert(
          "O arquivo selecionado não é uma imagem."
        );
        return;
      }

      const localImageUrl =
        URL.createObjectURL(file);

      const preview =
        document.getElementById(
          "poitaImagePreview"
        );

      const imageScreen =
        document.getElementById(
          "poitaImageScreen"
        );

      const readyScreen =
        document.getElementById(
          "poitaReadyScreen"
        );

      preview.src = localImageUrl;

      replaceImage(localImageUrl);

      imageScreen.classList.add(
        "poitaHidden"
      );

      readyScreen.classList.remove(
        "poitaHidden"
      );
    }

    // ==========================================
    // TROCAR IMAGEM
    // ==========================================

    function replaceImage(url) {

      if (imagePlane) {

        group.remove(imagePlane);

        if (imagePlane.geometry) {
          imagePlane.geometry.dispose();
        }

        if (imagePlane.material) {

          const uniforms =
            imagePlane.material.uniforms;

          if (
            uniforms &&
            uniforms.colorTexture &&
            uniforms.colorTexture.value
          ) {
            uniforms.colorTexture.value.dispose();
          }

          imagePlane.material.dispose();
        }

        imagePlane = null;
      }

      loadTexture(
        group,
        0.25,
        url
      );
    }

    // ==========================================
    // CARREGAR TEXTURA
    // ==========================================

    function loadTexture(target, length, url) {

      const loader = new THREE.TextureLoader();

      loader.load(

        url,

        function(texture) {

          if (
            document.getElementById("ARButton") === null
          ) {

            document.body.appendChild(
              ARButton.createButton(renderer)
            );
          }

          const originalWidth =
            texture.image.width;

          const originalHeight =
            texture.image.height;

          const max = Math.max(
            originalWidth,
            originalHeight
          );

          const width =
            (originalWidth / max) * length;

          const height =
            (originalHeight / max) * length;

          const geometry =
            new THREE.PlaneGeometry(
              width,
              height
            );

          texture.generateMipmaps = false;

          const sobelMaterial =
            new THREE.ShaderMaterial({

              transparent: true,

              side: THREE.DoubleSide,

              uniforms: {
                colorTexture: {
                  value: texture
                },

                opacity: {
                  value: currentOpacity
                }
              },

              vertexShader:
                document.getElementById(
                  "vertexshader"
                ).textContent,

              fragmentShader:
                document.getElementById(
                  "fragmentshader"
                ).textContent
            });

          imagePlane = new THREE.Mesh(
            geometry,
            sobelMaterial
          );

          target.add(imagePlane);
        },

        undefined,

        function(error) {

          console.error(
            "Erro ao carregar imagem:",
            error
          );

          alert(
            "Não foi possível carregar a imagem."
          );
        }
      );
    }

    // ==========================================
    // OPACIDADE
    // ==========================================

    function incrementOpacity(delta) {

      if (imageFixed) return;

      currentOpacity += delta;

      currentOpacity = Math.min(
        Math.max(currentOpacity, 0),
        1
      );

      if (imagePlane) {

        imagePlane.material
          .uniforms.opacity.value =
            currentOpacity;
      }
    }

    // ==========================================
    // ESCALA
    // ==========================================

    function incrementScale(delta) {

      if (imageFixed) return;

      const scaleSpeed = Math.max(
        currentScale,
        1
      );

      currentScale +=
        delta * scaleSpeed;

      currentScale = Math.min(
        Math.max(currentScale, 0),
        40
      );

      if (group) {

        group.scale.set(
          currentScale,
          currentScale,
          currentScale
        );
      }
    }

    // ==========================================
    // POSICIONAMENTO X / Y / Z
    // ==========================================

    function moveImage(axis, delta) {

      if (imageFixed || !group) {
        return;
      }

      const moveSpeed = 0.35;

      const distance =
        delta * moveSpeed;

      if (axis === "x") {
        group.translateX(distance);
      }

      else if (axis === "y") {
        group.translateY(distance);
      }

      else if (axis === "z") {
        group.translateZ(distance);
      }
    }

    // ==========================================
    // REDIMENSIONAMENTO DA JANELA
    // ==========================================

    function onWindowResize() {

      camera.aspect =
        window.innerWidth /
        window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    }

    // ==========================================
    // LOOP PRINCIPAL WEBXR
    // ==========================================

    function animate() {

      renderer.setAnimationLoop(loop);
    }

    function loop() {

      // A atualização do WebXR continua ativa
      // mesmo com imageFixed = true.

      ThreeMeshUI.update();

      if (modePanel) {
        modePanel.updateMatrixWorld(true);
      }

      updateInput();

      renderer.render(
        scene,
        camera
      );
    }

    // ==========================================
    // LEITURA DOS CONTROLADORES
    // ==========================================

    function updateInput() {

      const session =
        renderer.xr.getSession();

      const dt = clock.getDelta();

      hoveredMode = null;

      if (!session) {
        return;
      }

      let hideImagePressed = false;

      const sources = session.inputSources;

      for (let i = 0; i < sources.length; i++) {

        const gamepad = sources[i].gamepad;

        if (
          !gamepad ||
          gamepad.mapping !== "xr-standard"
        ) {
          continue;
        }

        const controller =
          renderer.xr.getController(i);

        const trigger =
          gamepad.buttons[0];

        const axButton =
          gamepad.buttons[4];

        const triggerPressed = Boolean(
          trigger && trigger.pressed
        );

        const justPressed =
          triggerPressed &&
          !previousTriggerPressed[i];

        const overPanel =
          isPointerOverModePanel(controller);

        const hoveredButton =
          getHoveredModeButton(controller);

        if (hoveredButton) {
          hoveredMode = hoveredButton.mode;
        }

        // ====================================
        // FIXAR / DESAFIXAR
        // ====================================

        if (
          justPressed &&
          hoveredButton
        ) {

          if (hoveredButton.mode === "fix") {

            imageFixed = !imageFixed;

            console.log(
              imageFixed
                ? "POITA: IMAGEM FIXADA"
                : "POITA: IMAGEM DESAFIXADA"
            );

          } else if (!imageFixed) {

            currentMode = hoveredButton.mode;

            console.log(
              "POITA modo:",
              currentMode
            );
          }
        }

        // ====================================
        // CONTROLES ANALÓGICOS
        // ====================================

        if (
          !imageFixed &&
          gamepad.axes.length >= 4
        ) {

          const horizontal =
            gamepad.axes[2];

          const vertical =
            gamepad.axes[3];

          if (currentMode === "scale") {

            if (vertical > 0.7) {
              incrementScale(-dt);
            }

            else if (vertical < -0.7) {
              incrementScale(dt);
            }

            if (horizontal > 0.7) {
              incrementOpacity(dt);
            }

            else if (horizontal < -0.7) {
              incrementOpacity(-dt);
            }
          }

          else if (currentMode === "x") {

            if (horizontal > 0.25) {
              moveImage("x", dt);
            }

            else if (horizontal < -0.25) {
              moveImage("x", -dt);
            }
          }

          else if (currentMode === "y") {

            if (vertical < -0.25) {
              moveImage("y", dt);
            }

            else if (vertical > 0.25) {
              moveImage("y", -dt);
            }
          }

          else if (currentMode === "z") {

            if (vertical < -0.25) {
              moveImage("z", -dt);
            }

            else if (vertical > 0.25) {
              moveImage("z", dt);
            }
          }
        }

        // ====================================
        // REPOSICIONAMENTO PELO GATILHO
        // ====================================
        //
        // O gatilho não reposiciona a imagem
        // quando ela está fixada.
        //
        // O painel permanece independente.
        // ====================================

        if (
          !imageFixed &&
          !overPanel &&
          triggerPressed &&
          group
        ) {

          controller.updateMatrixWorld(true);

          const offset =
            controller.localToWorld(
              new THREE.Vector3(
                0,
                0,
                -0.105
              )
            );

          group.position.copy(offset);

          const worldQuaternion =
            new THREE.Quaternion();

          controller.getWorldQuaternion(
            worldQuaternion
          );

          group.setRotationFromQuaternion(
            worldQuaternion
          );
        }

        previousTriggerPressed[i] =
          triggerPressed;

        if (
          axButton &&
          axButton.pressed
        ) {
          hideImagePressed = true;
        }
      }

      // Atualiza os botões sem recriar
      // propriedades desnecessariamente.

      updateModeButtonVisuals();

      // ====================================
      // MOSTRAR / OCULTAR IMAGEM
      // ====================================

      if (
        !hideImagePressed &&
        previousDidPressHideImage &&
        imagePlane
      ) {

        imagePlane.visible =
          !imagePlane.visible;
      }

      previousDidPressHideImage =
        hideImagePressed;
    }

  </script>
