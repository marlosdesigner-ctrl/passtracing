<!-- SHADER DE VÉRTICES -->

<script type="x-shader/x-vertex" id="vertexshader">
varying vec2 vUv;

void main() {
    vUv = uv;

    gl_Position =
        projectionMatrix *
        modelViewMatrix *
        vec4(position, 1.0);
}
</script>

<!-- SHADER DE FRAGMENTOS -->

<script type="x-shader/x-fragment" id="fragmentshader">
uniform sampler2D colorTexture;
uniform float opacity;

float stepSize = 2.0;

varying vec2 vUv;

float intensity(in vec4 color) {
    return sqrt(
        color.x * color.x +
        color.y * color.y +
        color.z * color.z
    );
}

void main() {
    vec2 uv = vUv;

    ivec2 imageSize = textureSize(colorTexture, 0);

    vec2 step = vec2(
        stepSize / float(imageSize.x),
        stepSize / float(imageSize.y)
    );

    float topLeft = intensity(
        texture2D(colorTexture, uv + vec2(-step.x, step.y))
    );

    float left = intensity(
        texture2D(colorTexture, uv + vec2(-step.x, 0.0))
    );

    float bottomLeft = intensity(
        texture2D(colorTexture, uv + vec2(-step.x, -step.y))
    );

    float top = intensity(
        texture2D(colorTexture, uv + vec2(0.0, step.y))
    );

    float bottom = intensity(
        texture2D(colorTexture, uv + vec2(0.0, -step.y))
    );

    float topRight = intensity(
        texture2D(colorTexture, uv + vec2(step.x, step.y))
    );

    float right = intensity(
        texture2D(colorTexture, uv + vec2(step.x, 0.0))
    );

    float bottomRight = intensity(
        texture2D(colorTexture, uv + vec2(step.x, -step.y))
    );

    float horizontal =
        topLeft + 2.0 * left + bottomLeft -
        topRight - 2.0 * right - bottomRight;

    float vertical =
        -topLeft - 2.0 * top - topRight +
        bottomLeft + 2.0 * bottom + bottomRight;

    float sobelResult = sqrt(
        horizontal * horizontal +
        vertical * vertical
    );

    vec4 sobelColor = vec4(
        1.0 - sobelResult,
        1.0 - sobelResult,
        1.0 - sobelResult,
        sobelResult
    );

    vec4 currentColor = texture2D(colorTexture, uv);

    float smoothOpacity = smoothstep(
        0.0, 0.3, opacity
    );

    gl_FragColor = vec4(
        currentColor.rgb * smoothOpacity +
        (1.0 - smoothOpacity) * sobelColor.rgb,

        currentColor.a * min(opacity, smoothOpacity) +
        (1.0 - smoothOpacity) * sobelColor.a
    );
}
</script>

<script type="module">

import * as THREE from "three";

import { OrbitControls }
    from "three/addons/controls/OrbitControls.js";

import { ARButton }
    from "three/addons/webxr/ARButton.js";

// ==========================================
// POITA - MURALOCK SYSTEM
// FIXAR / DESAFIXAR V2
// ==========================================

// VARIÁVEIS PRINCIPAIS

let container;
let camera;
let scene;
let renderer;

let controller1;
let controller2;

let clock;

let group = null;
let imagePlane = null;

let currentOpacity = 0.75;
let currentScale = 1.0;

let previousDidPressHideImage = false;

let currentMode = "scale";

// Esta variável bloqueia SOMENTE
// as transformações da imagem.

let imageFixed = false;

// INTERFACE INDEPENDENTE

let modePanel = null;
let modeButtons = [];

let menuHitArea = null;
let hoveredMode = null;

const uiRaycaster = new THREE.Raycaster();
const uiRayMatrix = new THREE.Matrix4();

const previousTriggerPressed = [false, false];

// ==========================================
// INICIALIZAÇÃO
// ==========================================

init();
animate();

function init() {

    container = document.getElementById("container");

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
        50,
        window.innerWidth / window.innerHeight,
        0.1,
        10
    );

    camera.position.set(0, 0, 1);

    const controls = new OrbitControls(
        camera,
        container
    );

    controls.minDistance = 0;
    controls.maxDistance = 8;

    clock = new THREE.Clock();

    renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
    });

    renderer.setPixelRatio(window.devicePixelRatio);

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.localClippingEnabled = true;

    renderer.xr.enabled = true;
    renderer.xr.setFoveation(0);

    container.appendChild(renderer.domElement);

    // ======================================
    // CONTROLADORES
    // ======================================

    controller1 = renderer.xr.getController(0);
    controller2 = renderer.xr.getController(1);

    scene.add(controller1);
    scene.add(controller2);

    const rayGeometry =
        new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0, 0, -1)
        ]);

    const rayMaterial =
        new THREE.LineBasicMaterial({
            color: 0xffffff
        });

    const ray1 = new THREE.Line(
        rayGeometry,
        rayMaterial
    );

    ray1.scale.z = 3;
    controller1.add(ray1);

    const ray2 = ray1.clone();
    controller2.add(ray2);

    // Cria o painel independente

    makeModeUI();

    // ======================================
    // GRUPO DA IMAGEM
    // ======================================

    group = new THREE.Group();

    group.position.set(0, 0, -0.5);

    scene.add(group);

    loadTexture(
        group,
        0.25,
        "Images/discovery.jpg"
    );

    window.addEventListener(
        "resize",
        onWindowResize
    );

    // ======================================
    // INTERFACE HTML
    // ======================================

    const enterPoitaLink =
        document.getElementById("enterPoitaLink");

    const poitaWelcome =
        document.getElementById("poitaWelcome");

    const poitaImageScreen =
        document.getElementById("poitaImageScreen");

    const poitaReadyScreen =
        document.getElementById("poitaReadyScreen");

    const startPoitaLink =
        document.getElementById("startPoitaLink");

    const localImageLink =
        document.getElementById("localImageLink");

    const changePoitaImageLink =
        document.getElementById("changePoitaImageLink");

    const imageFileInput =
        document.getElementById("imageFileInput");

    enterPoitaLink.onclick = function(event) {

        event.preventDefault();

        poitaWelcome.classList.add("poitaHidden");

        poitaImageScreen.classList.remove(
            "poitaHidden"
        );
    };

    localImageLink.onclick = function(event) {

        event.preventDefault();

        imageFileInput.value = "";
        imageFileInput.click();
    };

    imageFileInput.onchange = handleLocalImage;

    changePoitaImageLink.onclick = function(event) {

        event.preventDefault();

        imageFileInput.value = "";
        imageFileInput.click();
    };

    startPoitaLink.onclick = function(event) {

        event.preventDefault();

        const arButton =
            document.getElementById("ARButton");

        if (arButton) {

            poitaReadyScreen.classList.add(
                "poitaHidden"
            );

            arButton.click();
        }
    };
}

// ==========================================
// PAINEL DE CONTROLE INDEPENDENTE
// ==========================================
//
// Nesta versão, o painel usa apenas
// objetos nativos do Three.js.
//
// Os textos são CanvasTexture.
//
// Não existe atualização de layout
// pelo ThreeMeshUI.
// ==========================================

function makeModeUI() {

    modePanel = new THREE.Group();

    modePanel.position.set(
        0.0405,
        0.027,
        -0.0108
    );

    modePanel.scale.setScalar(0.27);

    // Painel preso ao controlador 1

    controller1.add(modePanel);

    // FUNDO DO PAINEL

    const background = new THREE.Mesh(

        new THREE.PlaneGeometry(
            0.99,
            0.22
        ),

        new THREE.MeshBasicMaterial({
            color: 0x20252b,
            transparent: true,
            opacity: 0.94,
            side: THREE.DoubleSide,
            depthTest: false
        })
    );

    background.position.z = -0.003;
    background.renderOrder = 100;

    modePanel.add(background);

    // ÁREA DE INTERAÇÃO DO PAINEL

    menuHitArea = new THREE.Mesh(

        new THREE.PlaneGeometry(
            1.02,
            0.25
        ),

        new THREE.MeshBasicMaterial({
            transparent: true,
            opacity: 0,
            side: THREE.DoubleSide,
            depthWrite: false,
            depthTest: false
        })
    );

    menuHitArea.position.z = 0.001;

    modePanel.add(menuHitArea);

    // TÍTULO

    const title = createCanvasLabel(
        "POITA  •  CONTROLE",
        0.88,
        0.060,
        34
    );

    title.position.set(
        0,
        0.063,
        0.004
    );

    modePanel.add(title);

    // BOTÕES

    const specs = [
        ["ESCALA", "scale", 0.155],
        ["X", "x", 0.155],
        ["Y", "y", 0.155],
        ["Z", "z", 0.155],
        ["FIXAR", "fix", 0.22]
    ];

    const gap = 0.014;

    const total =
        specs.reduce(
            (sum, item) => sum + item[2],
            0
        ) +
        gap * (specs.length - 1);

    let x = -total / 2;

    for (const [label, mode, width] of specs) {

        const item = createModeButton(
            label,
            mode,
            width
        );

        item.object.position.set(
            x + width / 2,
            -0.035,
            0.006
        );

        modePanel.add(item.object);

        x += width + gap;
    }

    updateModeButtonVisuals();
}

// ==========================================
// TEXTOS COM CANVAS TEXTURE
// ==========================================

function createCanvasLabel(
    content,
    width,
    height,
    fontSize = 44
) {

    const canvas =
        document.createElement("canvas");

    canvas.width = 512;
    canvas.height = 128;

    const ctx = canvas.getContext("2d");

    const texture = new THREE.CanvasTexture(
        canvas
    );

    const material = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        depthTest: false,
        depthWrite: false,
        side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(width, height),
        material
    );

    mesh.renderOrder = 103;

    mesh.userData.label = {
        canvas,
        ctx,
        texture,
        fontSize
    };

    drawCanvasLabel(mesh, content);

    return mesh;
}

function drawCanvasLabel(mesh, value) {

    // Não redesenha se o texto não mudou

    if (mesh.userData.lastLabel === value) {
        return;
    }

    const {
        canvas,
        ctx,
        texture,
        fontSize
    } = mesh.userData.label;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.font = "bold " + fontSize + "px Arial";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#ffffff";

    ctx.fillText(
        value,
        canvas.width / 2,
        canvas.height / 2,
        canvas.width - 16
    );

    texture.needsUpdate = true;

    mesh.userData.lastLabel = value;
}

// ==========================================
// CRIAÇÃO DOS BOTÕES
// ==========================================

function createModeButton(label, mode, width) {

    const holder = new THREE.Group();

    const background = new THREE.Mesh(

        new THREE.PlaneGeometry(
            width,
            0.075
        ),

        new THREE.MeshBasicMaterial({
            color: 0x404750,
            transparent: true,
            opacity: 1,
            depthTest: false,
            side: THREE.DoubleSide
        })
    );

    background.renderOrder = 101;

    holder.add(background);

    const textMesh = createCanvasLabel(
        label,
        width * 0.96,
        0.064,
        mode === "fix" ? 37 : 44
    );

    textMesh.position.z = 0.002;

    holder.add(textMesh);

    // Área de clique

    const hitArea = new THREE.Mesh(

        new THREE.PlaneGeometry(
            width + 0.009,
            0.09
        ),

        new THREE.MeshBasicMaterial({
            transparent: true,
            opacity: 0,
            side: THREE.DoubleSide,
            depthWrite: false,
            depthTest: false
        })
    );

    hitArea.position.z = 0.009;

    holder.add(hitArea);

    const item = {
        object: holder,
        hitArea,
        textMesh,
        background,
        mode
    };

    modeButtons.push(item);

    return item;
}

// ==========================================
// ATUALIZAÇÃO VISUAL DOS BOTÕES
// ==========================================
//
// FIXAR:
//   bloqueia ajustes da imagem.
//
// DESAFIXAR:
//   libera novamente os ajustes.
//
// O painel não é bloqueado.
// ==========================================

function updateModeButtonVisuals() {

    for (const info of modeButtons) {

        const isFix = info.mode === "fix";

        const label = isFix
            ? (
                imageFixed
                    ? "DESAFIXAR"
                    : "FIXAR"
              )
            : (
                info.mode === "scale"
                    ? "ESCALA"
                    : info.mode.toUpperCase()
              );

        const color = isFix
            ? (
                imageFixed
                    ? 0x267d59
                    : 0xff8800
              )
            : imageFixed
                ? 0x404750
                : (
                    info.mode === currentMode ||
                    info.mode === hoveredMode
                        ? 0xff8800
                        : 0x404750
                  );

        const opacity =
            (!isFix && imageFixed)
                ? 0.25
                : 1;

        // Atualiza somente quando necessário

        if (info.lastColor !== color) {

            info.background.material.color.setHex(
                color
            );

            info.lastColor = color;
        }

        if (info.lastOpacity !== opacity) {

            info.background.material.opacity =
                opacity;

            info.textMesh.material.opacity =
                opacity;

            info.lastOpacity = opacity;
        }

        drawCanvasLabel(
            info.textMesh,
            label
        );
    }
}

// ==========================================
// DETECÇÃO DE CLIQUE NOS BOTÕES
// ==========================================

function getHoveredModeButton(controller) {

    controller.updateMatrixWorld(true);

    if (modePanel) {
        modePanel.updateMatrixWorld(true);
    }

    uiRayMatrix.identity().extractRotation(
        controller.matrixWorld
    );

    uiRaycaster.ray.origin.setFromMatrixPosition(
        controller.matrixWorld
    );

    uiRaycaster.ray.direction
        .set(0, 0, -1)
        .applyMatrix4(uiRayMatrix)
        .normalize();

    let closestButton = null;
    let closestDistance = Infinity;

    for (const buttonInfo of modeButtons) {

        buttonInfo.hitArea.updateMatrixWorld(true);

        const intersections =
            uiRaycaster.intersectObject(
                buttonInfo.hitArea,
                false
            );

        if (
            intersections.length > 0 &&
            intersections[0].distance < closestDistance
        ) {

            closestDistance =
                intersections[0].distance;

            closestButton = buttonInfo;
        }
    }

    // Com a imagem fixada,
    // somente DESAFIXAR pode ser acionado.

    if (
        imageFixed &&
        closestButton &&
        closestButton.mode !== "fix"
    ) {
        return null;
    }

    return closestButton;
}

function isPointerOverModePanel(controller) {

    if (!menuHitArea || !modePanel) {
        return false;
    }

    controller.updateMatrixWorld(true);

    modePanel.updateMatrixWorld(true);
    menuHitArea.updateMatrixWorld(true);

    uiRayMatrix.identity().extractRotation(
        controller.matrixWorld
    );

    uiRaycaster.ray.origin.setFromMatrixPosition(
        controller.matrixWorld
    );

    uiRaycaster.ray.direction
        .set(0, 0, -1)
        .applyMatrix4(uiRayMatrix)
        .normalize();

    const intersections =
        uiRaycaster.intersectObject(
            menuHitArea,
            false
        );

    return intersections.length > 0;
}

// ==========================================
// ABRIR IMAGEM LOCAL
// ==========================================

function handleLocalImage(event) {

    const file = event.target.files[0];

    if (!file) {
        return;
    }

    if (!file.type.startsWith("image/")) {

        alert(
            "O arquivo selecionado não é uma imagem."
        );

        return;
    }

    const localImageUrl =
        URL.createObjectURL(file);

    const preview =
        document.getElementById(
            "poitaImagePreview"
        );

    const imageScreen =
        document.getElementById(
            "poitaImageScreen"
        );

    const readyScreen =
        document.getElementById(
            "poitaReadyScreen"
        );

    preview.src = localImageUrl;

    replaceImage(localImageUrl);

    imageScreen.classList.add(
        "poitaHidden"
    );

    readyScreen.classList.remove(
        "poitaHidden"
    );
}

// ==========================================
// TROCAR IMAGEM
// ==========================================

function replaceImage(url) {

    if (imagePlane) {

        group.remove(imagePlane);

        if (imagePlane.geometry) {
            imagePlane.geometry.dispose();
        }

        if (imagePlane.material) {

            const uniforms =
                imagePlane.material.uniforms;

            if (
                uniforms &&
                uniforms.colorTexture &&
                uniforms.colorTexture.value
            ) {

                uniforms.colorTexture.value.dispose();
            }

            imagePlane.material.dispose();
        }

        imagePlane = null;
    }

    loadTexture(
        group,
        0.25,
        url
    );
}

// ==========================================
// CARREGAMENTO DA TEXTURA
// ==========================================

function loadTexture(target, length, url) {

    const loader = new THREE.TextureLoader();

    loader.load(

        url,

        function(texture) {

            // Cria botão de entrada no WebXR

            if (
                document.getElementById("ARButton") === null
            ) {

                document.body.appendChild(
                    ARButton.createButton(renderer)
                );
            }

            const originalWidth =
                texture.image.width;

            const originalHeight =
                texture.image.height;

            const max = Math.max(
                originalWidth,
                originalHeight
            );

            const width =
                (originalWidth / max) * length;

            const height =
                (originalHeight / max) * length;

            const geometry =
                new THREE.PlaneGeometry(
                    width,
                    height
                );

            texture.generateMipmaps = false;

            const sobelMaterial =
                new THREE.ShaderMaterial({

                    transparent: true,

                    side: THREE.DoubleSide,

                    uniforms: {

                        colorTexture: {
                            value: texture
                        },

                        opacity: {
                            value: currentOpacity
                        }
                    },

                    vertexShader:
                        document.getElementById(
                            "vertexshader"
                        ).textContent,

                    fragmentShader:
                        document.getElementById(
                            "fragmentshader"
                        ).textContent
                });

            imagePlane = new THREE.Mesh(
                geometry,
                sobelMaterial
            );

            target.add(imagePlane);
        },

        undefined,

        function(error) {

            console.error(
                "Erro ao carregar imagem:",
                error
            );

            alert(
                "Não foi possível carregar a imagem."
            );
        }
    );
}

// ==========================================
// OPACIDADE
// ==========================================

function incrementOpacity(delta) {

    if (imageFixed) {
        return;
    }

    currentOpacity += delta;

    currentOpacity = Math.min(
        Math.max(currentOpacity, 0),
        1
    );

    if (imagePlane) {

        imagePlane.material
            .uniforms.opacity.value =
                currentOpacity;
    }
}

// ==========================================
// ESCALA
// ==========================================

function incrementScale(delta) {

    if (imageFixed) {
        return;
    }

    const scaleSpeed = Math.max(
        currentScale,
        1
    );

    currentScale += delta * scaleSpeed;

    currentScale = Math.min(
        Math.max(currentScale, 0),
        40
    );

    if (group) {

        group.scale.set(
            currentScale,
            currentScale,
            currentScale
        );
    }
}

// ==========================================
// POSICIONAMENTO X / Y / Z
// ==========================================

function moveImage(axis, delta) {

    if (imageFixed || !group) {
        return;
    }

    const moveSpeed = 0.35;

    const distance = delta * moveSpeed;

    if (axis === "x") {

        group.translateX(distance);
    }

    else if (axis === "y") {

        group.translateY(distance);
    }

    else if (axis === "z") {

        group.translateZ(distance);
    }
}

// ==========================================
// REDIMENSIONAMENTO DA JANELA
// ==========================================

function onWindowResize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}

// ==========================================
// LOOP PRINCIPAL
// ==========================================
//
// IMPORTANTE:
//
// FIXAR não interrompe este loop.
//
// A atualização dos controladores,
// do painel e do WebXR permanece ativa.
// ==========================================

function animate() {

    renderer.setAnimationLoop(loop);
}

function loop() {

    if (modePanel) {
        modePanel.updateMatrixWorld(true);
    }

    updateInput();

    renderer.render(
        scene,
        camera
    );
}

// ==========================================
// LEITURA DOS CONTROLADORES
// ==========================================

function updateInput() {

    const session = renderer.xr.getSession();

    const dt = clock.getDelta();

    hoveredMode = null;

    if (!session) {
        return;
    }

    let hideImagePressed = false;

    const sources = session.inputSources;

    for (let i = 0; i < sources.length; i++) {

        const gamepad = sources[i].gamepad;

        if (
            !gamepad ||
            gamepad.mapping !== "xr-standard"
        ) {
            continue;
        }

        const controller =
            renderer.xr.getController(i);

        const trigger = gamepad.buttons[0];
        const axButton = gamepad.buttons[4];

        const triggerPressed = Boolean(
            trigger && trigger.pressed
        );

        const justPressed =
            triggerPressed &&
            !previousTriggerPressed[i];

        const overPanel =
            isPointerOverModePanel(controller);

        const hoveredButton =
            getHoveredModeButton(controller);

        if (hoveredButton) {
            hoveredMode = hoveredButton.mode;
        }

        // ==================================
        // FIXAR / DESAFIXAR
        // ==================================
        //
        // Esta ação modifica somente
        // o estado de bloqueio da imagem.
        //
        // Não desativa controladores.
        // Não desativa o painel.
        // Não interrompe o WebXR.
        // ==================================

        if (
            justPressed &&
            hoveredButton
        ) {

            if (hoveredButton.mode === "fix") {

                imageFixed = !imageFixed;

                console.log(
                    imageFixed
                        ? "POITA: IMAGEM FIXADA"
                        : "POITA: IMAGEM DESAFIXADA"
                );
            }

            else if (!imageFixed) {

                currentMode =
                    hoveredButton.mode;

                console.log(
                    "POITA modo:",
                    currentMode
                );
            }
        }

        // ==================================
        // CONTROLES ANALÓGICOS
        // ==================================

        if (
            !imageFixed &&
            gamepad.axes.length >= 4
        ) {

            const horizontal =
                gamepad.axes[2];

            const vertical =
                gamepad.axes[3];

            // ESCALA E OPACIDADE

            if (currentMode === "scale") {

                if (vertical > 0.7) {

                    incrementScale(-dt);
                }

                else if (vertical < -0.7) {

                    incrementScale(dt);
                }

                if (horizontal > 0.7) {

                    incrementOpacity(dt);
                }

                else if (horizontal < -0.7) {

                    incrementOpacity(-dt);
                }
            }

            // EIXO X

            else if (currentMode === "x") {

                if (horizontal > 0.25) {

                    moveImage("x", dt);
                }

                else if (horizontal < -0.25) {

                    moveImage("x", -dt);
                }
            }

            // EIXO Y

            else if (currentMode === "y") {

                if (vertical < -0.25) {

                    moveImage("y", dt);
                }

                else if (vertical > 0.25) {

                    moveImage("y", -dt);
                }
            }

            // EIXO Z

            else if (currentMode === "z") {

                if (vertical < -0.25) {

                    moveImage("z", -dt);
                }

                else if (vertical > 0.25) {

                    moveImage("z", dt);
                }
            }
        }

        // ==================================
        // REPOSICIONAMENTO PELO GATILHO
        // ==================================
        //
        // Somente funciona quando:
        //
        // 1. A imagem não está fixada.
        // 2. O controlador não aponta
        //    para o painel.
        // ==================================

        if (
            !imageFixed &&
            !overPanel &&
            triggerPressed &&
            group
        ) {

            controller.updateMatrixWorld(true);

            const offset =
                controller.localToWorld(
                    new THREE.Vector3(
                        0,
                        0,
                        -0.105
                    )
                );

            group.position.copy(offset);

            const worldQuaternion =
                new THREE.Quaternion();

            controller.getWorldQuaternion(
                worldQuaternion
            );

            group.setRotationFromQuaternion(
                worldQuaternion
            );
        }

        previousTriggerPressed[i] =
            triggerPressed;

        if (
            axButton &&
            axButton.pressed
        ) {

            hideImagePressed = true;
        }
    }

    // Atualização visual independente

    updateModeButtonVisuals();

    // ==================================
    // MOSTRAR / OCULTAR IMAGEM
    // ==================================

    if (
        !hideImagePressed &&
        previousDidPressHideImage &&
        imagePlane
    ) {

        imagePlane.visible =
            !imagePlane.visible;
    }

    previousDidPressHideImage =
        hideImagePressed;
}

</script>
