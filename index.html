<!-- ===================================== -->
<!-- SHADER DE VÉRTICES                   -->
<!-- ===================================== -->

<script id="vertexshader" type="x-shader/x-vertex">
varying vec2 vUv;

void main(){
 vUv=uv;
 gl_Position=
  projectionMatrix*
  modelViewMatrix*
  vec4(position,1.0);
}
</script>

<!-- ===================================== -->
<!-- SHADER DE FRAGMENTOS                 -->
<!-- ===================================== -->

<script id="fragmentshader" type="x-shader/x-fragment">
uniform sampler2D colorTexture;
uniform float opacity;

varying vec2 vUv;

float intensity(vec4 c){
 return sqrt(
  c.r*c.r+
  c.g*c.g+
  c.b*c.b
 );
}

void main(){
 ivec2 sz=textureSize(colorTexture,0);

 vec2 st=vec2(
  2.0/float(sz.x),
  2.0/float(sz.y)
 );

 float tl=intensity(texture2D(
  colorTexture,vUv+vec2(-st.x,st.y)
 ));

 float l=intensity(texture2D(
  colorTexture,vUv+vec2(-st.x,0.0)
 ));

 float bl=intensity(texture2D(
  colorTexture,vUv+vec2(-st.x,-st.y)
 ));

 float t=intensity(texture2D(
  colorTexture,vUv+vec2(0.0,st.y)
 ));

 float b=intensity(texture2D(
  colorTexture,vUv+vec2(0.0,-st.y)
 ));

 float tr=intensity(texture2D(
  colorTexture,vUv+vec2(st.x,st.y)
 ));

 float r=intensity(texture2D(
  colorTexture,vUv+vec2(st.x,0.0)
 ));

 float br=intensity(texture2D(
  colorTexture,vUv+vec2(st.x,-st.y)
 ));

 float h=tl+2.0*l+bl-tr-2.0*r-br;
 float v=-tl-2.0*t-tr+bl+2.0*b+br;

 float edge=sqrt(h*h+v*v);

 vec4 sobel=vec4(
  vec3(1.0-edge),
  edge
 );

 vec4 original=texture2D(
  colorTexture,vUv
 );

 float blend=smoothstep(
  0.0,0.3,opacity
 );

 gl_FragColor=vec4(
  original.rgb*blend+
  (1.0-blend)*sobel.rgb,

  original.a*min(opacity,blend)+
  (1.0-blend)*sobel.a
 );
}
</script>

<script type="module">

import * as THREE from "three";

import {OrbitControls}
from "three/addons/controls/OrbitControls.js";

import {ARButton}
from "three/addons/webxr/ARButton.js";

// ============================================
// POITA - MURALOCK SYSTEM
//
// INTERFACE REFINADA
// ROTAÇÃO X / Y / Z INDEPENDENTE
// ANCORAGEM ESPACIAL PERSISTENTE
// FIXAR / DESAFIXAR
//
// VERSÃO EXPERIMENTAL PARA QUEST 2
// ============================================

// ============================================
// CONFIGURAÇÃO PRINCIPAL
// ============================================

let scene;
let camera;
let renderer;
let clock;

let controller1;
let controller2;

let group;
let imagePlane=null;

let currentOpacity=.75;
let currentScale=1;

let currentMode="scale";
let imageFixed=false;

const rotationSpeed=.8;

// ============================================
// INTERFACE THREE.JS
// ============================================

let modePanel;
let menuHitArea;

const modeButtons=[];

let hoveredMode=null;

const raycaster=new THREE.Raycaster();
const rayMatrix=new THREE.Matrix4();

const previousTrigger=[false,false];

let previousHide=false;

// ============================================
// IMAGEM
// ============================================

let currentImageUrl=null;
let imageLoaded=false;
let imageLoading=false;
let imageLoadGeneration=0;

// ============================================
// ANCORAGEM ESPACIAL
// ============================================

const STORAGE_KEY="poita-anchor-v1";

let activeAnchor=null;

let anchorCreating=false;
let anchorPending=false;
let anchorRestoring=false;

let anchorPersistent=false;
let anchorStatus="LIVRE";

let anchorGeneration=0;
let savedAnchorData=null;

const anchorPosition=new THREE.Vector3();
const anchorQuaternion=new THREE.Quaternion();

// ============================================
// ARMAZENAMENTO
// ============================================

function readSavedAnchor(){
 try{
  const raw=localStorage.getItem(STORAGE_KEY);
  return raw?JSON.parse(raw):null;
 }catch(error){
  console.warn(
   "POITA: dados salvos indisponíveis",
   error
  );
  return null;
 }
}

function storeAnchorData(data){
 try{
  localStorage.setItem(
   STORAGE_KEY,
   JSON.stringify(data)
  );
  return true;
 }catch(error){
  console.warn(
   "POITA: falha ao salvar dados",
   error
  );
  return false;
 }
}

// ============================================
// CONFIGURAÇÕES DA IMAGEM
// ============================================

function serializeImage(){
 return{
  scale:currentScale,
  opacity:currentOpacity,
  visible:imagePlane?imagePlane.visible:true
 };
}

function restoreImageSettings(data){
 if(!data)return;

 if(Number.isFinite(data.scale)){
  currentScale=data.scale;
  group.scale.setScalar(currentScale);
 }

 if(Number.isFinite(data.opacity)){
  currentOpacity=data.opacity;

  if(imagePlane){
   imagePlane.material.uniforms.opacity.value=
    currentOpacity;
  }
 }

 if(
  imagePlane &&
  typeof data.visible==="boolean"
 ){
  imagePlane.visible=data.visible;
 }
}

function setAnchorStatus(message){
 anchorStatus=message;
 console.log("POITA:",message);
 updateModeButtonVisuals();
}

// ============================================
// SOLICITAR ÂNCORA
// ============================================

function requestAnchorCreation(){
 if(
  anchorCreating ||
  anchorRestoring ||
  !imageFixed
 ){
  return;
 }

 const session=renderer.xr.getSession();

 if(!session)return;

 if(typeof XRigidTransform==="undefined"){
  setAnchorStatus("FIXO - SEM API");
  return;
 }

 anchorPending=true;
 setAnchorStatus("ANCORANDO...");
}

// ============================================
// CRIAR ÂNCORA
// ============================================

function createAnchorInFrame(frame){
 if(
  !anchorPending ||
  anchorCreating ||
  !imageFixed
 ){
  return;
 }

 anchorPending=false;

 const session=renderer.xr.getSession();
 const referenceSpace=renderer.xr.getReferenceSpace();

 if(
  !session ||
  !referenceSpace ||
  !frame ||
  typeof frame.createAnchor!=="function"
 ){
  setAnchorStatus("FIXO - SEM ÂNCORA");
  return;
 }

 anchorCreating=true;

 const generation=++anchorGeneration;

 group.updateMatrixWorld(true);

 const position=group.position;
 const quaternion=group.quaternion;

 const pose=new XRigidTransform(
  {
   x:position.x,
   y:position.y,
   z:position.z
  },
  {
   x:quaternion.x,
   y:quaternion.y,
   z:quaternion.z,
   w:quaternion.w
  }
 );

 let creation;

 try{
  creation=frame.createAnchor(
   pose,
   referenceSpace
  );
 }catch(error){
  console.error(
   "Erro ao criar âncora",
   error
  );

  anchorCreating=false;
  setAnchorStatus("FIXO - FALHA ÂNCORA");
  return;
 }

 Promise.resolve(creation)
 .then(async anchor=>{

  if(
   generation!==anchorGeneration ||
   !imageFixed
  ){
   try{anchor.delete()}catch(error){}
   return;
  }

  activeAnchor=anchor;
  anchorPersistent=false;

  setAnchorStatus("ÂNCORA ATIVA");

  if(
   typeof anchor.requestPersistentHandle
   ==="function"
  ){
   try{
    const handle=
     await anchor.requestPersistentHandle();

    if(
     generation!==anchorGeneration ||
     !imageFixed
    ){
     return;
    }

    const previous=readSavedAnchor();

    const data={
     handle,
     image:serializeImage(),
     createdAt:new Date().toISOString()
    };

    if(storeAnchorData(data)){
     savedAnchorData=data;
     anchorPersistent=true;

     setAnchorStatus("ÂNCORA SALVA");

     if(
      previous?.handle &&
      previous.handle!==handle &&
      typeof session.deletePersistentAnchor
       ==="function"
     ){
      session.deletePersistentAnchor(
       previous.handle
      ).catch(error=>{
       console.warn(
        "Âncora anterior não removida",
        error
       );
      });
     }
    }else{
     setAnchorStatus("ÂNCORA SEM SALVAR");
    }

   }catch(error){
    console.warn(
     "Persistência não disponível",
     error
    );
    setAnchorStatus("ÂNCORA TEMPORÁRIA");
   }
  }else{
   setAnchorStatus("ÂNCORA TEMPORÁRIA");
  }

 })
 .catch(error=>{
  console.error(
   "Falha ao criar âncora",
   error
  );
  setAnchorStatus("FIXO - FALHA ÂNCORA");
 })
 .finally(()=>{
  if(generation===anchorGeneration){
   anchorCreating=false;
  }
 });
}

// ============================================
// RESTAURAR ÂNCORA
// ============================================

async function restorePersistentAnchor(){
 const session=renderer.xr.getSession();
 const data=readSavedAnchor();

 if(!session||!data?.handle)return;

 if(
  typeof session.restorePersistentAnchor
  !=="function"
 ){
  setAnchorStatus(
   "RESTAURAÇÃO INDISPONÍVEL"
  );
  return;
 }

 anchorRestoring=true;

 const generation=++anchorGeneration;

 setAnchorStatus("RESTAURANDO...");

 try{
  const anchor=
   await session.restorePersistentAnchor(
    data.handle
   );

  if(generation!==anchorGeneration){
   try{anchor.delete()}catch(error){}
   return;
  }

  activeAnchor=anchor;
  anchorPersistent=true;
  savedAnchorData=data;

  restoreImageSettings(data.image);

  imageFixed=true;

  setAnchorStatus("ÂNCORA RESTAURADA");

 }catch(error){
  console.warn(
   "Não foi possível restaurar âncora",
   error
  );
  setAnchorStatus("ÂNCORA NÃO LOCALIZADA");
 }finally{
  if(generation===anchorGeneration){
   anchorRestoring=false;
  }
 }
}

// ============================================
// ATUALIZAR POSIÇÃO DA ÂNCORA
// ============================================

function updateAnchorPose(frame){
 if(
  !imageFixed ||
  !activeAnchor ||
  !frame
 ){
  return;
 }

 const referenceSpace=
  renderer.xr.getReferenceSpace();

 if(!referenceSpace)return;

 let pose=null;

 try{
  pose=frame.getPose(
   activeAnchor.anchorSpace,
   referenceSpace
  );
 }catch(error){
  console.warn(
   "Falha ao consultar âncora",
   error
  );
  return;
 }

 if(!pose)return;

 const p=pose.transform.position;
 const q=pose.transform.orientation;

 anchorPosition.set(
  p.x,p.y,p.z
 );

 anchorQuaternion.set(
  q.x,q.y,q.z,q.w
 );

 group.position.copy(anchorPosition);
 group.quaternion.copy(anchorQuaternion);
}

// ============================================
// FIXAR / DESAFIXAR
// ============================================

function toggleFixation(){
 if(
  anchorCreating ||
  anchorRestoring
 ){
  return;
 }

 if(!imageFixed){
  imageFixed=true;
  requestAnchorCreation();
 }else{
  imageFixed=false;
  anchorPending=false;
  anchorGeneration++;

  activeAnchor=null;
  anchorPersistent=false;
  anchorCreating=false;

  setAnchorStatus("DESAFIXADO");
 }

 updateModeButtonVisuals();
}

// ============================================
// INICIALIZAÇÃO
// ============================================

init();
animate();

function init(){
 scene=new THREE.Scene();

 camera=new THREE.PerspectiveCamera(
  50,
  window.innerWidth/window.innerHeight,
  .1,
  10
 );

 camera.position.set(0,0,1);

 renderer=new THREE.WebGLRenderer({
  antialias:true,
  alpha:true
 });

 renderer.setPixelRatio(
  window.devicePixelRatio
 );

 renderer.setSize(
  window.innerWidth,
  window.innerHeight
 );

 renderer.outputEncoding=
  THREE.sRGBEncoding;

 renderer.xr.enabled=true;
 renderer.xr.setFoveation(0);

 document.getElementById("container")
  .appendChild(renderer.domElement);

 const orbit=new OrbitControls(
  camera,
  renderer.domElement
 );

 orbit.minDistance=0;
 orbit.maxDistance=8;

 clock=new THREE.Clock();

 // ==========================================
 // CONTROLADORES
 // ==========================================

 controller1=renderer.xr.getController(0);
 controller2=renderer.xr.getController(1);

 scene.add(controller1,controller2);

 const geometry=
  new THREE.BufferGeometry()
   .setFromPoints([
    new THREE.Vector3(0,0,0),
    new THREE.Vector3(0,0,-1)
   ]);

 const material=
  new THREE.LineBasicMaterial({
   color:0xffffff
  });

 for(const controller of [
  controller1,
  controller2
 ]){
  const ray=new THREE.Line(
   geometry,
   material
  );

  ray.scale.z=3;
  controller.add(ray);
 }

 // ==========================================
 // IMAGEM
 // ==========================================

 group=new THREE.Group();
 group.position.set(0,0,-.5);
 scene.add(group);

 // ==========================================
 // INTERFACE
 // ==========================================

 makeModeUI();
 setupHTMLInterface();

 // ==========================================
 // WEBXR
 // ==========================================

 const arButton=ARButton.createButton(
  renderer,
  {
   optionalFeatures:[
    "anchors",
    "local-floor",
    "bounded-floor"
   ]
  }
 );

 document.body.appendChild(arButton);

 renderer.xr.addEventListener(
  "sessionstart",
  ()=>{
   previousTrigger[0]=false;
   previousTrigger[1]=false;

   restorePersistentAnchor();
  }
 );

 renderer.xr.addEventListener(
  "sessionend",
  ()=>{
   activeAnchor=null;
   anchorPending=false;
   anchorCreating=false;
   anchorRestoring=false;

   anchorGeneration++;
   imageFixed=false;

   setAnchorStatus("LIVRE");
  }
 );

 window.addEventListener(
  "resize",
  onWindowResize
 );
}

// ============================================
// TEXTURA DE TEXTO SEM DISTORÇÃO
// ============================================
//
// A resolução da textura respeita
// a proporção real do plano.
//
// Exemplo:
// Plano largo -> Canvas largo.
//
// Assim, o Three.js não achata
// verticalmente os caracteres.
// ============================================

function createCanvasLabel(
 content,
 width,
 height,
 textHeightRatio=.62
){
 // Resolução proporcional à geometria.
 const pixelDensity=1800;

 const canvasWidth=Math.max(
  256,
  Math.ceil(width*pixelDensity)
 );

 const canvasHeight=Math.max(
  128,
  Math.ceil(height*pixelDensity)
 );

 // Mantém a proporção matemática
 // exata entre textura e plano.
 const canvas=document.createElement("canvas");

 canvas.width=canvasWidth;
 canvas.height=canvasHeight;

 const ctx=canvas.getContext("2d");

 const texture=new THREE.CanvasTexture(canvas);

 texture.minFilter=THREE.LinearFilter;
 texture.magFilter=THREE.LinearFilter;

 texture.generateMipmaps=false;

 const material=new THREE.MeshBasicMaterial({
  map:texture,
  transparent:true,
  depthTest:false,
  depthWrite:false,
  side:THREE.DoubleSide,
  toneMapped:false
 });

 const mesh=new THREE.Mesh(
  new THREE.PlaneGeometry(width,height),
  material
 );

 mesh.renderOrder=103;

 mesh.userData.label={
  canvas,
  ctx,
  texture,
  textHeightRatio
 };

 drawCanvasLabel(mesh,content);

 return mesh;
}

// ============================================
// DESENHO DE TEXTO EM ALTA RESOLUÇÃO
// ============================================

function drawCanvasLabel(mesh,value){
 if(mesh.userData.lastLabel===value){
  return;
 }

 const{
  canvas,
  ctx,
  texture,
  textHeightRatio
 }=mesh.userData.label;

 ctx.clearRect(
  0,0,
  canvas.width,
  canvas.height
 );

 // Altura real da fonte proporcional
 // à altura da textura.
 let fontSize=
  canvas.height*textHeightRatio;

 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillStyle="#FFFFFF";

 // Fonte sem compressão horizontal.
 ctx.font=
  "700 "+fontSize+"px Arial, sans-serif";

 // Ajusta o tamanho da fonte,
 // não a largura das letras.
 const maxWidth=canvas.width*.91;

 let measured=ctx.measureText(value).width;

 if(measured>maxWidth){
  fontSize*=maxWidth/measured;

  ctx.font=
   "700 "+fontSize+"px Arial, sans-serif";
 }

 // Contorno sutil para melhorar
 // leitura sobre fundos variados.
 ctx.lineWidth=Math.max(
  1,
  fontSize*.035
 );

 ctx.strokeStyle="rgba(0,0,0,.65)";

 ctx.lineJoin="round";

 const centerX=canvas.width/2;
 const centerY=canvas.height/2;

 ctx.strokeText(
  value,
  centerX,
  centerY
 );

 ctx.fillText(
  value,
  centerX,
  centerY
 );

 texture.needsUpdate=true;

 mesh.userData.lastLabel=value;
}

// ============================================
// BOTÕES REFINADOS
// ============================================

function createModeButton(label,mode,width){
 const holder=new THREE.Group();

 // Fundo do botão.
 const background=new THREE.Mesh(
  new THREE.PlaneGeometry(
   width,
   .112
  ),
  new THREE.MeshBasicMaterial({
   color:0x35404d,
   transparent:true,
   opacity:1,
   side:THREE.DoubleSide,
   depthTest:false,
   depthWrite:false
  })
 );

 background.renderOrder=101;
 holder.add(background);

 // Filete superior para acabamento.
 const topLine=new THREE.Mesh(
  new THREE.PlaneGeometry(
   width*.94,
   .003
  ),
  new THREE.MeshBasicMaterial({
   color:0x7e8d9d,
   transparent:true,
   opacity:.5,
   depthTest:false
  })
 );

 topLine.position.set(
  0,
  .052,
  .001
 );

 topLine.renderOrder=102;
 holder.add(topLine);

 // Texto mais alto e nítido.
 const textMesh=createCanvasLabel(
  label,
  width*.96,
  .086,
  .66
 );

 textMesh.position.z=.004;

 holder.add(textMesh);

 // Área de clique.
 const hitArea=new THREE.Mesh(
  new THREE.PlaneGeometry(
   width+.008,
   .125
  ),
  new THREE.MeshBasicMaterial({
   transparent:true,
   opacity:0,
   side:THREE.DoubleSide,
   depthWrite:false,
   depthTest:false
  })
 );

 hitArea.position.z=.009;

 holder.add(hitArea);

 const item={
  object:holder,
  background,
  textMesh,
  hitArea,
  mode
 };

 modeButtons.push(item);

 return item;
}

// ============================================
// ESTADO VISUAL DOS BOTÕES
// ============================================

function updateModeButtonVisuals(){
 for(const info of modeButtons){
  const isFix=info.mode==="fix";

  let label;

  if(isFix){
   label=imageFixed?"DESAFIXAR":"FIXAR";
  }else if(info.mode==="scale"){
   label="ESCALA";
  }else if(info.mode==="rotX"){
   label="ROT X";
  }else if(info.mode==="rotY"){
   label="ROT Y";
  }else if(info.mode==="rotZ"){
   label="ROT Z";
  }else{
   label=info.mode.toUpperCase();
  }

  const color=isFix
   ?imageFixed?0x267d59:0xd97819
   :imageFixed?0x35404d
   :(info.mode===currentMode||
     info.mode===hoveredMode)
    ?0xd97819
    :0x35404d;

  const opacity=
   (!isFix&&imageFixed)?.25:1;

  if(info.lastColor!==color){
   info.background.material.color.setHex(
    color
   );
   info.lastColor=color;
  }

  if(info.lastOpacity!==opacity){
   info.background.material.opacity=
    opacity;

   info.textMesh.material.opacity=
    opacity;

   info.lastOpacity=opacity;
  }

  drawCanvasLabel(
   info.textMesh,
   label
  );
 }
}

// ============================================
// RAYCASTER
// ============================================

function configureRay(controller){
 controller.updateMatrixWorld(true);
 modePanel.updateMatrixWorld(true);

 rayMatrix.identity().extractRotation(
  controller.matrixWorld
 );

 raycaster.ray.origin.setFromMatrixPosition(
  controller.matrixWorld
 );

 raycaster.ray.direction
  .set(0,0,-1)
  .applyMatrix4(rayMatrix)
  .normalize();
}

function getHoveredModeButton(controller){
 configureRay(controller);

 let closest=null;
 let distance=Infinity;

 for(const item of modeButtons){
  item.hitArea.updateMatrixWorld(true);

  const hits=raycaster.intersectObject(
   item.hitArea,
   false
  );

  if(
   hits.length &&
   hits[0].distance<distance
  ){
   distance=hits[0].distance;
   closest=item;
  }
 }

 if(
  imageFixed &&
  closest &&
  closest.mode!=="fix"
 ){
  return null;
 }

 return closest;
}

function isPointerOverModePanel(controller){
 configureRay(controller);

 menuHitArea.updateMatrixWorld(true);

 return raycaster.intersectObject(
  menuHitArea,
  false
 ).length>0;
}

// ============================================
// ROTAÇÃO INDEPENDENTE
// ============================================

function rotateImage(axis,delta){
 if(imageFixed||!group)return;

 const angle=delta*rotationSpeed;

 if(axis==="x"){
  group.rotateX(angle);
 }else if(axis==="y"){
  group.rotateY(angle);
 }else if(axis==="z"){
  group.rotateZ(angle);
 }
}

// ============================================
// SELEÇÃO DE IMAGEM
// ============================================

function handleLocalImage(event){
 const file=event.target.files[0];

 if(!file)return;

 if(!file.type.startsWith("image/")){
  alert("Selecione uma imagem válida.");
  return;
 }

 const url=URL.createObjectURL(file);

 imageLoaded=false;
 imageLoading=true;

 document.getElementById(
  "poitaImagePreview"
 ).src=url;

 document.getElementById(
  "poitaStatus"
 ).textContent="CARREGANDO IMAGEM...";

 replaceImage(url);

 document.getElementById(
  "poitaImageScreen"
 ).classList.add("poitaHidden");

 document.getElementById(
  "poitaReadyScreen"
 ).classList.remove("poitaHidden");
}

// ============================================
// SUBSTITUIR IMAGEM
// ============================================

function replaceImage(url){
 const generation=++imageLoadGeneration;

 imageLoaded=false;
 imageLoading=true;

 if(imagePlane){
  group.remove(imagePlane);
  imagePlane.geometry.dispose();

  const uniforms=imagePlane.material.uniforms;

  if(uniforms?.colorTexture?.value){
   uniforms.colorTexture.value.dispose();
  }

  imagePlane.material.dispose();
  imagePlane=null;
 }

 const oldUrl=currentImageUrl;
 currentImageUrl=url;

 loadTexture(url,generation,oldUrl);
}

// ============================================
// CARREGAR TEXTURA
// ============================================

function loadTexture(url,generation,oldUrl){
 new THREE.TextureLoader().load(
  url,
  texture=>{
   if(generation!==imageLoadGeneration){
    texture.dispose();
    return;
   }

   const w=texture.image.width;
   const h=texture.image.height;
   const max=Math.max(w,h);

   texture.generateMipmaps=false;

   const geometry=new THREE.PlaneGeometry(
    w/max*.25,
    h/max*.25
   );

   const material=new THREE.ShaderMaterial({
    transparent:true,
    side:THREE.DoubleSide,
    uniforms:{
     colorTexture:{value:texture},
     opacity:{value:currentOpacity}
    },
    vertexShader:
     document.getElementById(
      "vertexshader"
     ).textContent,
    fragmentShader:
     document.getElementById(
      "fragmentshader"
     ).textContent
   });

   imagePlane=new THREE.Mesh(
    geometry,
    material
   );

   group.add(imagePlane);

   imageLoaded=true;
   imageLoading=false;

   document.getElementById(
    "poitaStatus"
   ).textContent="IMAGEM CARREGADA";

   if(savedAnchorData?.image){
    restoreImageSettings(
     savedAnchorData.image
    );
   }

   if(oldUrl?.startsWith("blob:")){
    URL.revokeObjectURL(oldUrl);
   }
  },
  undefined,
  error=>{
   console.error(
    "Erro de textura",
    error
   );

   if(generation===imageLoadGeneration){
    imageLoaded=false;
    imageLoading=false;

    document.getElementById(
     "poitaStatus"
    ).textContent=
     "ERRO AO CARREGAR IMAGEM";
   }
  }
 );
}

// ============================================
// OPACIDADE
// ============================================

function incrementOpacity(delta){
 if(imageFixed)return;

 currentOpacity=THREE.MathUtils.clamp(
  currentOpacity+delta,
  0,
  1
 );

 if(imagePlane){
  imagePlane.material.uniforms.opacity.value=
   currentOpacity;
 }
}

// ============================================
// ESCALA
// ============================================

function incrementScale(delta){
 if(imageFixed)return;

 currentScale+=
  delta*Math.max(currentScale,1);

 currentScale=THREE.MathUtils.clamp(
  currentScale,
  .01,
  40
 );

 group.scale.setScalar(currentScale);
}

// ============================================
// POSICIONAMENTO XYZ
// ============================================

function moveImage(axis,delta){
 if(imageFixed)return;

 const distance=delta*.35;

 if(axis==="x"){
  group.translateX(distance);
 }else if(axis==="y"){
  group.translateY(distance);
 }else if(axis==="z"){
  group.translateZ(distance);
 }
}

// ============================================
// REDIMENSIONAMENTO
// ============================================

function onWindowResize(){
 camera.aspect=
  window.innerWidth/window.innerHeight;

 camera.updateProjectionMatrix();

 renderer.setSize(
  window.innerWidth,
  window.innerHeight
 );
}

// ============================================
// LOOP WEBXR
// ============================================

function animate(){
 renderer.setAnimationLoop(loop);
}

function loop(time,frame){
 if(modePanel){
  modePanel.updateMatrixWorld(true);
 }

 if(frame){
  createAnchorInFrame(frame);
  updateAnchorPose(frame);
 }

 updateInput();

 renderer.render(scene,camera);
}

// ============================================
// CONTROLADORES
// ============================================

function updateInput(){
 const session=renderer.xr.getSession();

 const dt=Math.min(
  clock.getDelta(),
  .05
 );

 hoveredMode=null;

 if(!session)return;

 let hidePressed=false;

 const sources=session.inputSources;

 for(let i=0;i<sources.length;i++){
  const source=sources[i];
  const gamepad=source.gamepad;

  if(
   !gamepad ||
   gamepad.mapping!=="xr-standard"
  ){
   continue;
  }

  const controller=
   renderer.xr.getController(i);

  const trigger=gamepad.buttons[0];
  const axButton=gamepad.buttons[4];

  const pressed=Boolean(
   trigger?.pressed
  );

  const justPressed=
   pressed&&!previousTrigger[i];

  const overPanel=
   isPointerOverModePanel(controller);

  const hovered=
   getHoveredModeButton(controller);

  if(hovered){
   hoveredMode=hovered.mode;
  }

  // ========================================
  // SELEÇÃO DOS BOTÕES
  // ========================================

  if(justPressed&&hovered){
   if(hovered.mode==="fix"){
    toggleFixation();
   }else if(!imageFixed){
    currentMode=hovered.mode;

    console.log(
     "POITA: MODO",
     currentMode
    );
   }
  }

  // ========================================
  // ANALÓGICOS
  // ========================================

  if(
   !imageFixed &&
   gamepad.axes.length>=4
  ){
   const horizontal=gamepad.axes[2];
   const vertical=gamepad.axes[3];

   // ESCALA E OPACIDADE
   if(currentMode==="scale"){
    if(vertical>.7){
     incrementScale(-dt);
    }else if(vertical<-.7){
     incrementScale(dt);
    }

    if(horizontal>.7){
     incrementOpacity(dt);
    }else if(horizontal<-.7){
     incrementOpacity(-dt);
    }
   }

   // POSIÇÃO X
   else if(currentMode==="x"){
    if(horizontal>.25){
     moveImage("x",dt);
    }else if(horizontal<-.25){
     moveImage("x",-dt);
    }
   }

   // POSIÇÃO Y
   else if(currentMode==="y"){
    if(vertical<-.25){
     moveImage("y",dt);
    }else if(vertical>.25){
     moveImage("y",-dt);
    }
   }

   // POSIÇÃO Z
   else if(currentMode==="z"){
    if(vertical<-.25){
     moveImage("z",-dt);
    }else if(vertical>.25){
     moveImage("z",dt);
    }
   }

   // ROTAÇÃO X
   else if(currentMode==="rotX"){
    if(Math.abs(horizontal)>.25){
     rotateImage(
      "x",
      horizontal*dt
     );
    }
   }

   // ROTAÇÃO Y
   else if(currentMode==="rotY"){
    if(Math.abs(horizontal)>.25){
     rotateImage(
      "y",
      horizontal*dt
     );
    }
   }

   // ROTAÇÃO Z
   else if(currentMode==="rotZ"){
    if(Math.abs(horizontal)>.25){
     rotateImage(
      "z",
      horizontal*dt
     );
    }
   }
  }

  // ========================================
  // REPOSICIONAMENTO PELO GATILHO
  // ========================================

  if(
   !imageFixed &&
   !overPanel &&
   pressed &&
   group
  ){
   controller.updateMatrixWorld(true);

   const offset=controller.localToWorld(
    new THREE.Vector3(
     0,0,-.105
    )
   );

   group.position.copy(offset);

   const quaternion=new THREE.Quaternion();

   controller.getWorldQuaternion(
    quaternion
   );

   group.setRotationFromQuaternion(
    quaternion
   );
  }

  previousTrigger[i]=pressed;

  if(axButton?.pressed){
   hidePressed=true;
  }
 }

 updateModeButtonVisuals();

 // ========================================
 // MOSTRAR / OCULTAR IMAGEM
 // ========================================

 if(
  !hidePressed &&
  previousHide &&
  imagePlane
 ){
  imagePlane.visible=
   !imagePlane.visible;
 }

 previousHide=hidePressed;
}

</script>
