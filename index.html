<script id="vertexshader" type="x-shader/x-vertex">
varying vec2 vUv;
void main(){
 vUv=uv;
 gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
}
</script>

<script id="fragmentshader" type="x-shader/x-fragment">
uniform sampler2D colorTexture;
uniform float opacity;
varying vec2 vUv;

float intensity(vec4 c){
 return sqrt(c.r*c.r+c.g*c.g+c.b*c.b);
}

void main(){
 ivec2 sz=textureSize(colorTexture,0);
 vec2 st=vec2(2.0/float(sz.x),2.0/float(sz.y));

 float tl=intensity(texture2D(colorTexture,vUv+vec2(-st.x,st.y)));
 float l=intensity(texture2D(colorTexture,vUv+vec2(-st.x,0.0)));
 float bl=intensity(texture2D(colorTexture,vUv+vec2(-st.x,-st.y)));
 float t=intensity(texture2D(colorTexture,vUv+vec2(0.0,st.y)));
 float b=intensity(texture2D(colorTexture,vUv+vec2(0.0,-st.y)));
 float tr=intensity(texture2D(colorTexture,vUv+vec2(st.x,st.y)));
 float r=intensity(texture2D(colorTexture,vUv+vec2(st.x,0.0)));
 float br=intensity(texture2D(colorTexture,vUv+vec2(st.x,-st.y)));

 float h=tl+2.0*l+bl-tr-2.0*r-br;
 float v=-tl-2.0*t-tr+bl+2.0*b+br;
 float edge=sqrt(h*h+v*v);

 vec4 sobel=vec4(vec3(1.0-edge),edge);
 vec4 original=texture2D(colorTexture,vUv);
 float blend=smoothstep(0.0,0.3,opacity);

 gl_FragColor=vec4(
  original.rgb*blend+(1.0-blend)*sobel.rgb,
  original.a*min(opacity,blend)+(1.0-blend)*sobel.a
 );
}
</script>

<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {ARButton} from "three/addons/webxr/ARButton.js";

// ============================================
// POITA - MURALOCK SYSTEM
// ROTAÇÃO XYZ + ANCORAGEM PERSISTENTE
// ============================================

let scene,camera,renderer,clock;
let controller1,controller2;
let group,imagePlane=null;
let modePanel,menuHitArea;

let currentOpacity=.75;
let currentScale=1;
let currentMode="scale";
let rotationAxis="x";
let imageFixed=false;

const rotationSpeed=.8;
const modeButtons=[];
const raycaster=new THREE.Raycaster();
const rayMatrix=new THREE.Matrix4();

let hoveredMode=null;
let previousHide=false;
const previousTrigger=[false,false];

// ============================================
// ANCORAGEM ESPACIAL
// ============================================

const STORAGE_KEY="poita-anchor-v1";

let activeAnchor=null;
let anchorCreating=false;
let anchorPending=false;
let anchorRestoring=false;
let anchorPersistent=false;
let anchorStatus="LIVRE";
let lastFrame=null;
let anchorGeneration=0;

let savedAnchorData=null;

// Matrizes temporárias
const anchorPosition=new THREE.Vector3();
const anchorQuaternion=new THREE.Quaternion();
const anchorScale=new THREE.Vector3(1,1,1);

function readSavedAnchor(){
 try{
  const raw=localStorage.getItem(STORAGE_KEY);
  return raw?JSON.parse(raw):null;
 }catch(error){
  console.warn("POITA: dados salvos indisponíveis",error);
  return null;
 }
}

function storeAnchorData(data){
 try{
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
  return true;
 }catch(error){
  console.warn("POITA: falha ao salvar dados",error);
  return false;
 }
}

function serializeImage(){
 return {
  scale:currentScale,
  opacity:currentOpacity,
  visible:imagePlane?imagePlane.visible:true
 };
}

function restoreImageSettings(data){
 if(!data)return;

 if(Number.isFinite(data.scale)){
  currentScale=data.scale;
  group.scale.setScalar(currentScale);
 }

 if(Number.isFinite(data.opacity)){
  currentOpacity=data.opacity;
  if(imagePlane){
   imagePlane.material.uniforms.opacity.value=currentOpacity;
  }
 }

 if(imagePlane && typeof data.visible==="boolean"){
  imagePlane.visible=data.visible;
 }
}

function setAnchorStatus(message){
 anchorStatus=message;
 console.log("POITA:",message);
 updateModeButtonVisuals();
}

// ============================================
// CRIAR ÂNCORA NA POSIÇÃO ATUAL
// ============================================

function requestAnchorCreation(){
 if(anchorCreating||anchorRestoring||!imageFixed)return;

 const session=renderer.xr.getSession();
 if(!session)return;

 if(typeof XRigidTransform==="undefined"){
  setAnchorStatus("FIXO - SEM API");
  return;
 }

 // A criação precisa acontecer em um XRFrame.
 anchorPending=true;
 setAnchorStatus("ANCORANDO...");
}

function createAnchorInFrame(frame){
 if(!anchorPending||anchorCreating||!imageFixed)return;

 anchorPending=false;

 const session=renderer.xr.getSession();
 const referenceSpace=renderer.xr.getReferenceSpace();

 if(
  !session||
  !referenceSpace||
  !frame||
  typeof frame.createAnchor!=="function"
 ){
  setAnchorStatus("FIXO - SEM ÂNCORA");
  return;
 }

 anchorCreating=true;
 const generation=++anchorGeneration;

 // O grupo está diretamente na cena.
 group.updateMatrixWorld(true);

 const position=group.position;
 const quaternion=group.quaternion;

 const pose=new XRigidTransform(
  {
   x:position.x,
   y:position.y,
   z:position.z
  },
  {
   x:quaternion.x,
   y:quaternion.y,
   z:quaternion.z,
   w:quaternion.w
  }
 );

 let creation;

 try{
  creation=frame.createAnchor(pose,referenceSpace);
 }catch(error){
  console.error("Erro ao criar âncora",error);
  anchorCreating=false;
  setAnchorStatus("FIXO - FALHA ÂNCORA");
  return;
 }

 Promise.resolve(creation).then(async anchor=>{
  if(generation!==anchorGeneration||!imageFixed){
   try{anchor.delete()}catch(e){}
   return;
  }

  activeAnchor=anchor;
  anchorPersistent=false;

  setAnchorStatus("ÂNCORA ATIVA");

  // Persistência entre sessões
  if(typeof anchor.requestPersistentHandle==="function"){
   try{
    const handle=await anchor.requestPersistentHandle();

    if(generation!==anchorGeneration||!imageFixed)return;

    const previous=readSavedAnchor();

    const data={
     handle,
     image:serializeImage(),
     createdAt:new Date().toISOString()
    };

    if(storeAnchorData(data)){
     savedAnchorData=data;
     anchorPersistent=true;
     setAnchorStatus("ÂNCORA SALVA");

     // Evita acumular âncoras persistentes.
     if(
      previous?.handle&&
      previous.handle!==handle&&
      typeof session.deletePersistentAnchor==="function"
     ){
      session.deletePersistentAnchor(previous.handle)
       .catch(error=>console.warn(
        "Âncora anterior não removida",error
       ));
     }
    }else{
     setAnchorStatus("ÂNCORA SEM SALVAR");
    }

   }catch(error){
    console.warn("Persistência não disponível",error);
    setAnchorStatus("ÂNCORA TEMPORÁRIA");
   }
  }else{
   setAnchorStatus("ÂNCORA TEMPORÁRIA");
  }

 }).catch(error=>{
  console.error("Falha ao criar âncora",error);
  setAnchorStatus("FIXO - FALHA ÂNCORA");
 }).finally(()=>{
  if(generation===anchorGeneration){
   anchorCreating=false;
  }
 });
}

// ============================================
// RESTAURAR ÂNCORA DE OUTRA SESSÃO
// ============================================

async function restorePersistentAnchor(){
 const session=renderer.xr.getSession();
 const data=readSavedAnchor();

 if(!session||!data?.handle)return;

 if(typeof session.restorePersistentAnchor!=="function"){
  setAnchorStatus("RESTAURAÇÃO INDISPONÍVEL");
  return;
 }

 anchorRestoring=true;
 const generation=++anchorGeneration;

 setAnchorStatus("RESTAURANDO...");

 try{
  const anchor=await session.restorePersistentAnchor(
   data.handle
  );

  if(generation!==anchorGeneration){
   try{anchor.delete()}catch(e){}
   return;
  }

  activeAnchor=anchor;
  anchorPersistent=true;
  savedAnchorData=data;

  restoreImageSettings(data.image);

  imageFixed=true;
  setAnchorStatus("ÂNCORA RESTAURADA");

 }catch(error){
  console.warn("Não foi possível restaurar âncora",error);
  setAnchorStatus("ÂNCORA NÃO LOCALIZADA");
 }finally{
  if(generation===anchorGeneration){
   anchorRestoring=false;
  }
 }
}

// ============================================
// ACOMPANHAR ÂNCORA A CADA FRAME
// ============================================

function updateAnchorPose(frame){
 if(!imageFixed||!activeAnchor||!frame)return;

 const referenceSpace=renderer.xr.getReferenceSpace();
 if(!referenceSpace)return;

 let pose=null;

 try{
  pose=frame.getPose(
   activeAnchor.anchorSpace,
   referenceSpace
  );
 }catch(error){
  console.warn("Falha ao consultar âncora",error);
  return;
 }

 // Se o rastreamento for perdido, preserva
 // a última transformação conhecida.
 if(!pose)return;

 const p=pose.transform.position;
 const q=pose.transform.orientation;

 anchorPosition.set(p.x,p.y,p.z);
 anchorQuaternion.set(q.x,q.y,q.z,q.w);

 group.position.copy(anchorPosition);
 group.quaternion.copy(anchorQuaternion);
}

// ============================================
// FIXAR / DESAFIXAR
// ============================================

function toggleFixation(){
 if(anchorCreating||anchorRestoring)return;

 if(!imageFixed){
  imageFixed=true;
  requestAnchorCreation();
 }else{
  imageFixed=false;
  anchorPending=false;
  anchorGeneration++;

  // Solta a referência ativa.
  // A âncora persistente continua armazenada
  // até a próxima fixação.
  activeAnchor=null;
  anchorPersistent=false;
  anchorCreating=false;

  setAnchorStatus("DESAFIXADO");
 }

 updateModeButtonVisuals();
}

// ============================================
// INICIALIZAÇÃO
// ============================================

init();
animate();

function init(){
 scene=new THREE.Scene();

 camera=new THREE.PerspectiveCamera(
  50,innerWidth/innerHeight,.1,10
 );
 camera.position.set(0,0,1);

 renderer=new THREE.WebGLRenderer({
  antialias:true,
  alpha:true
 });

 renderer.setPixelRatio(devicePixelRatio);
 renderer.setSize(innerWidth,innerHeight);
 renderer.outputEncoding=THREE.sRGBEncoding;
 renderer.xr.enabled=true;
 renderer.xr.setFoveation(0);

 document.getElementById("container")
  .appendChild(renderer.domElement);

 const orbit=new OrbitControls(
  camera,renderer.domElement
 );
 orbit.minDistance=0;
 orbit.maxDistance=8;

 clock=new THREE.Clock();

 controller1=renderer.xr.getController(0);
 controller2=renderer.xr.getController(1);

 scene.add(controller1,controller2);

 const geometry=new THREE.BufferGeometry()
  .setFromPoints([
   new THREE.Vector3(0,0,0),
   new THREE.Vector3(0,0,-1)
  ]);

 const material=new THREE.LineBasicMaterial({
  color:0xffffff
 });

 for(const controller of [controller1,controller2]){
  const ray=new THREE.Line(geometry,material);
  ray.scale.z=3;
  controller.add(ray);
 }

 group=new THREE.Group();
 group.position.set(0,0,-.5);
 scene.add(group);

 makeModeUI();
 setupHTMLInterface();

 // A solicitação de anchors é opcional:
 // se não houver suporte, o AR continua.
 const arButton=ARButton.createButton(renderer,{
  optionalFeatures:[
   "anchors",
   "local-floor",
   "bounded-floor"
  ]
 });

 document.body.appendChild(arButton);

 renderer.xr.addEventListener("sessionstart",()=>{
  previousTrigger[0]=false;
  previousTrigger[1]=false;
  restorePersistentAnchor();
 });

 renderer.xr.addEventListener("sessionend",()=>{
  activeAnchor=null;
  anchorPending=false;
  anchorCreating=false;
  anchorRestoring=false;
  anchorGeneration++;
  imageFixed=false;
  setAnchorStatus("LIVRE");
 });

 addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
 });
}

// ============================================
// INTERFACE HTML
// ============================================

function setupHTMLInterface(){
 const welcome=document.getElementById("poitaWelcome");
 const imageScreen=document.getElementById("poitaImageScreen");
 const ready=document.getElementById("poitaReadyScreen");
 const fileInput=document.getElementById("imageFileInput");

 document.getElementById("enterPoitaLink").onclick=e=>{
  e.preventDefault();
  welcome.classList.add("poitaHidden");
  imageScreen.classList.remove("poitaHidden");
 };

 document.getElementById("localImageLink").onclick=e=>{
  e.preventDefault();
  fileInput.value="";
  fileInput.click();
 };

 document.getElementById("changePoitaImageLink").onclick=e=>{
  e.preventDefault();
  fileInput.value="";
  fileInput.click();
 };

 fileInput.onchange=handleLocalImage;

 document.getElementById("startPoitaLink").onclick=e=>{
  e.preventDefault();
  const button=document.getElementById("ARButton");
  if(button){
   ready.classList.add("poitaHidden");
   button.click();
  }
 };
}

// ============================================
// PAINEL NATIVO THREE.JS
// ============================================

function makeModeUI(){
 modePanel=new THREE.Group();
 modePanel.position.set(.0405,.027,-.0108);
 modePanel.scale.setScalar(.27);
 controller1.add(modePanel);

 const background=new THREE.Mesh(
  new THREE.PlaneGeometry(1.22,.22),
  new THREE.MeshBasicMaterial({
   color:0x20252b,
   transparent:true,
   opacity:.94,
   side:THREE.DoubleSide,
   depthTest:false
  })
 );
 background.position.z=-.003;
 background.renderOrder=100;
 modePanel.add(background);

 menuHitArea=new THREE.Mesh(
  new THREE.PlaneGeometry(1.25,.25),
  new THREE.MeshBasicMaterial({
   transparent:true,
   opacity:0,
   side:THREE.DoubleSide,
   depthWrite:false,
   depthTest:false
  })
 );
 menuHitArea.position.z=.001;
 modePanel.add(menuHitArea);

 const title=createCanvasLabel(
  "POITA • CONTROLE",1.10,.06,34
 );
 title.position.set(0,.063,.004);
 modePanel.add(title);

 const specs=[
  ["ESCALA","scale",.155],
  ["X","x",.155],
  ["Y","y",.155],
  ["Z","z",.155],
  ["ROT X","rotate",.19],
  ["FIXAR","fix",.22]
 ];

 const gap=.014;
 const total=specs.reduce((n,s)=>n+s[2],0)
  +gap*(specs.length-1);

 let x=-total/2;

 for(const [label,mode,width] of specs){
  const item=createModeButton(label,mode,width);
  item.object.position.set(x+width/2,-.035,.006);
  modePanel.add(item.object);
  x+=width+gap;
 }

 updateModeButtonVisuals();
}

function createCanvasLabel(content,width,height,fontSize=44){
 const canvas=document.createElement("canvas");
 canvas.width=512;
 canvas.height=128;

 const ctx=canvas.getContext("2d");
 const texture=new THREE.CanvasTexture(canvas);

 const material=new THREE.MeshBasicMaterial({
  map:texture,
  transparent:true,
  depthTest:false,
  depthWrite:false,
  side:THREE.DoubleSide
 });

 const mesh=new THREE.Mesh(
  new THREE.PlaneGeometry(width,height),
  material
 );

 mesh.renderOrder=103;
 mesh.userData.label={canvas,ctx,texture,fontSize};
 drawCanvasLabel(mesh,content);
 return mesh;
}

function drawCanvasLabel(mesh,value){
 if(mesh.userData.lastLabel===value)return;

 const {canvas,ctx,texture,fontSize}=mesh.userData.label;

 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.font="bold "+fontSize+"px Arial";
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillStyle="#ffffff";

 ctx.fillText(
  value,canvas.width/2,canvas.height/2,canvas.width-16
 );

 texture.needsUpdate=true;
 mesh.userData.lastLabel=value;
}

function createModeButton(label,mode,width){
 const holder=new THREE.Group();

 const background=new THREE.Mesh(
  new THREE.PlaneGeometry(width,.075),
  new THREE.MeshBasicMaterial({
   color:0x404750,
   transparent:true,
   opacity:1,
   depthTest:false,
   side:THREE.DoubleSide
  })
 );
 background.renderOrder=101;
 holder.add(background);

 const fontSize=mode==="fix"?35:
  mode==="rotate"?38:44;

 const textMesh=createCanvasLabel(
  label,width*.96,.064,fontSize
 );
 textMesh.position.z=.002;
 holder.add(textMesh);

 const hitArea=new THREE.Mesh(
  new THREE.PlaneGeometry(width+.009,.09),
  new THREE.MeshBasicMaterial({
   transparent:true,
   opacity:0,
   side:THREE.DoubleSide,
   depthWrite:false,
   depthTest:false
  })
 );
 hitArea.position.z=.009;
 holder.add(hitArea);

 const item={
  object:holder,
  background,
  textMesh,
  hitArea,
  mode
 };

 modeButtons.push(item);
 return item;
}

function updateModeButtonVisuals(){
 for(const info of modeButtons){
  const isFix=info.mode==="fix";

  let label;

  if(isFix){
   label=imageFixed?"DESAFIXAR":"FIXAR";
  }else if(info.mode==="rotate"){
   label="ROT "+rotationAxis.toUpperCase();
  }else if(info.mode==="scale"){
   label="ESCALA";
  }else{
   label=info.mode.toUpperCase();
  }

  const color=isFix
   ?imageFixed?0x267d59:0xff8800
   :imageFixed?0x404750
   :(info.mode===currentMode||info.mode===hoveredMode)
    ?0xff8800:0x404750;

  const opacity=(!isFix&&imageFixed)?.25:1;

  if(info.lastColor!==color){
   info.background.material.color.setHex(color);
   info.lastColor=color;
  }

  if(info.lastOpacity!==opacity){
   info.background.material.opacity=opacity;
   info.textMesh.material.opacity=opacity;
   info.lastOpacity=opacity;
  }

  drawCanvasLabel(info.textMesh,label);
 }
}

// ============================================
// INTERAÇÃO DO PAINEL
// ============================================

function configureRay(controller){
 controller.updateMatrixWorld(true);
 modePanel.updateMatrixWorld(true);

 rayMatrix.identity().extractRotation(
  controller.matrixWorld
 );

 raycaster.ray.origin.setFromMatrixPosition(
  controller.matrixWorld
 );

 raycaster.ray.direction.set(0,0,-1)
  .applyMatrix4(rayMatrix).normalize();
}

function getHoveredModeButton(controller){
 configureRay(controller);

 let closest=null;
 let distance=Infinity;

 for(const item of modeButtons){
  item.hitArea.updateMatrixWorld(true);

  const hits=raycaster.intersectObject(
   item.hitArea,false
  );

  if(hits.length&&hits[0].distance<distance){
   distance=hits[0].distance;
   closest=item;
  }
 }

 if(imageFixed&&closest?.mode!=="fix")return null;
 return closest;
}

function isPointerOverModePanel(controller){
 configureRay(controller);
 menuHitArea.updateMatrixWorld(true);

 return raycaster.intersectObject(
  menuHitArea,false
 ).length>0;
}

// ============================================
// SELEÇÃO DE ROTAÇÃO
// ============================================

function selectRotationMode(){
 if(imageFixed)return;

 if(currentMode!=="rotate"){
  currentMode="rotate";
  rotationAxis="x";
 }else{
  rotationAxis=rotationAxis==="x"?"y":
   rotationAxis==="y"?"z":"x";
 }

 console.log("POITA: ROT",rotationAxis);
}

function rotateImage(delta){
 if(imageFixed||!group)return;

 const angle=delta*rotationSpeed;

 if(rotationAxis==="x")group.rotateX(angle);
 else if(rotationAxis==="y")group.rotateY(angle);
 else group.rotateZ(angle);
}

// ============================================
// CARREGAMENTO DE IMAGENS
// ============================================

let currentImageUrl=null;

function handleLocalImage(event){
 const file=event.target.files[0];
 if(!file)return;

 if(!file.type.startsWith("image/")){
  alert("Selecione uma imagem válida.");
  return;
 }

 const url=URL.createObjectURL(file);

 document.getElementById("poitaImagePreview").src=url;

 replaceImage(url);

 document.getElementById("poitaImageScreen")
  .classList.add("poitaHidden");

 document.getElementById("poitaReadyScreen")
  .classList.remove("poitaHidden");
}

function replaceImage(url){
 if(imagePlane){
  group.remove(imagePlane);
  imagePlane.geometry.dispose();

  const uniforms=imagePlane.material.uniforms;

  if(uniforms?.colorTexture?.value){
   uniforms.colorTexture.value.dispose();
  }

  imagePlane.material.dispose();
  imagePlane=null;
 }

 if(currentImageUrl?.startsWith("blob:")){
  URL.revokeObjectURL(currentImageUrl);
 }

 currentImageUrl=url;
 loadTexture(url);
}

function loadTexture(url){
 new THREE.TextureLoader().load(
  url,
  texture=>{
   const w=texture.image.width;
   const h=texture.image.height;
   const max=Math.max(w,h);

   texture.generateMipmaps=false;

   const geometry=new THREE.PlaneGeometry(
    w/max*.25,
    h/max*.25
   );

   const material=new THREE.ShaderMaterial({
    transparent:true,
    side:THREE.DoubleSide,
    uniforms:{
     colorTexture:{value:texture},
     opacity:{value:currentOpacity}
    },
    vertexShader:document.getElementById(
     "vertexshader"
    ).textContent,
    fragmentShader:document.getElementById(
     "fragmentshader"
    ).textContent
   });

   imagePlane=new THREE.Mesh(geometry,material);
   group.add(imagePlane);

   if(savedAnchorData?.image){
    restoreImageSettings(savedAnchorData.image);
   }
  },
  undefined,
  error=>console.error("Erro de textura",error)
 );
}

// ============================================
// CONTROLES DA IMAGEM
// ============================================

function incrementOpacity(delta){
 if(imageFixed)return;

 currentOpacity=THREE.MathUtils.clamp(
  currentOpacity+delta,0,1
 );

 if(imagePlane){
  imagePlane.material.uniforms.opacity.value=
   currentOpacity;
 }
}

function incrementScale(delta){
 if(imageFixed)return;

 currentScale+=delta*Math.max(currentScale,1);
 currentScale=THREE.MathUtils.clamp(
  currentScale,.01,40
 );

 group.scale.setScalar(currentScale);
}

function moveImage(axis,delta){
 if(imageFixed)return;

 const distance=delta*.35;

 if(axis==="x")group.translateX(distance);
 if(axis==="y")group.translateY(distance);
 if(axis==="z")group.translateZ(distance);
}

// ============================================
// LOOP WEBXR
// ============================================

function animate(){
 renderer.setAnimationLoop(loop);
}

function loop(time,frame){
 // O loop nunca é interrompido pelo FIXAR.
 if(modePanel){
  modePanel.updateMatrixWorld(true);
 }

 if(frame){
  createAnchorInFrame(frame);
  updateAnchorPose(frame);
 }

 updateInput();

 renderer.render(scene,camera);
}

// ============================================
// CONTROLADORES
// ============================================

function updateInput(){
 const session=renderer.xr.getSession();
 const dt=Math.min(clock.getDelta(),.05);

 hoveredMode=null;
 if(!session)return;

 let hidePressed=false;

 const sources=session.inputSources;

 for(let i=0;i<sources.length;i++){
  const source=sources[i];
  const gamepad=source.gamepad;

  if(!gamepad||gamepad.mapping!=="xr-standard"){
   continue;
  }

  const controller=renderer.xr.getController(i);

  const trigger=gamepad.buttons[0];
  const axButton=gamepad.buttons[4];

  const pressed=Boolean(trigger?.pressed);
  const justPressed=pressed&&!previousTrigger[i];

  const overPanel=isPointerOverModePanel(controller);
  const hovered=getHoveredModeButton(controller);

  if(hovered){
   hoveredMode=hovered.mode;
  }

  // CLIQUES NOS BOTÕES
  if(justPressed&&hovered){

   if(hovered.mode==="fix"){
    toggleFixation();

   }else if(!imageFixed&&hovered.mode==="rotate"){
    selectRotationMode();

   }else if(!imageFixed){
    currentMode=hovered.mode;
   }
  }

  // ANALÓGICOS
  if(!imageFixed&&gamepad.axes.length>=4){
   const horizontal=gamepad.axes[2];
   const vertical=gamepad.axes[3];

   if(currentMode==="scale"){
    if(vertical>.7)incrementScale(-dt);
    else if(vertical<-.7)incrementScale(dt);

    if(horizontal>.7)incrementOpacity(dt);
    else if(horizontal<-.7)incrementOpacity(-dt);

   }else if(currentMode==="x"){
    if(horizontal>.25)moveImage("x",dt);
    else if(horizontal<-.25)moveImage("x",-dt);

   }else if(currentMode==="y"){
    if(vertical<-.25)moveImage("y",dt);
    else if(vertical>.25)moveImage("y",-dt);

   }else if(currentMode==="z"){
    if(vertical<-.25)moveImage("z",-dt);
    else if(vertical>.25)moveImage("z",dt);

   }else if(currentMode==="rotate"){
    if(Math.abs(horizontal)>.25){
     rotateImage(horizontal*dt);
    }
   }
  }

  // REPOSICIONAMENTO PELO GATILHO
  if(!imageFixed&&!overPanel&&pressed){
   controller.updateMatrixWorld(true);

   const offset=controller.localToWorld(
    new THREE.Vector3(0,0,-.105)
   );

   group.position.copy(offset);

   const quaternion=new THREE.Quaternion();
   controller.getWorldQuaternion(quaternion);
   group.setRotationFromQuaternion(quaternion);
  }

  previousTrigger[i]=pressed;

  if(axButton?.pressed){
   hidePressed=true;
  }
 }

 updateModeButtonVisuals();

 // A/X - VISIBILIDADE DA IMAGEM
 if(!hidePressed&&previousHide&&imagePlane){
  imagePlane.visible=!imagePlane.visible;
 }

 previousHide=hidePressed;
}

</script>
