        <script type="x-shader/x-vertex" id="vertexshader">
        varying vec2 vUv;

        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
        </script>

        <script type="x-shader/x-fragment" id="fragmentshader">
        uniform sampler2D colorTexture;
        uniform float opacity;
        float stepSize = 2.0;

        varying vec2 vUv;

        float intensity(in vec4 color) {
            return sqrt((color.x*color.x)+(color.y*color.y)+(color.z*color.z));
        }

        void main() {
            vec2 uv = vUv;
            
            ivec2 imageSize = textureSize(colorTexture, 0);
            vec2 step = vec2(stepSize/float(imageSize.x), stepSize/float(imageSize.y));

            float topLeft     = intensity(texture2D(colorTexture, uv + vec2(-step.x, step.y)));
            float left        = intensity(texture2D(colorTexture, uv + vec2(-step.x, 0)));
            float bottomLeft  = intensity(texture2D(colorTexture, uv + vec2(-step.x, -step.y)));
            float top         = intensity(texture2D(colorTexture, uv + vec2(0, step.y)));
            float bottom      = intensity(texture2D(colorTexture, uv + vec2(0, -step.y)));
            float topRight    = intensity(texture2D(colorTexture, uv + vec2(step.x, step.y)));
            float right       = intensity(texture2D(colorTexture, uv + vec2(step.x, 0)));
            float bottomRight = intensity(texture2D(colorTexture, uv + vec2(step.x, -step.y)));
         
            float horizontal = topLeft + 2.0 * left + bottomLeft - topRight - 2.0 * right - bottomRight;
            float vertical = -topLeft - 2.0 * top - topRight + bottomLeft + 2.0 * bottom + bottomRight;

            float sobelResult = sqrt(horizontal * horizontal + vertical * vertical);

            vec4 sobelColor = vec4(1.0 - sobelResult, 1.0 - sobelResult, 1.0 - sobelResult, sobelResult);
            vec4 currentColor = texture2D(colorTexture, uv);

            float smoothOpacity = smoothstep(0.0, 0.3, opacity);

            gl_FragColor = vec4(
                currentColor.x * smoothOpacity + (1.0 - smoothOpacity) * sobelColor.x,
                currentColor.y * smoothOpacity + (1.0 - smoothOpacity) * sobelColor.y,
                currentColor.z * smoothOpacity + (1.0 - smoothOpacity) * sobelColor.z,
                currentColor.w * min(opacity, smoothOpacity) + (1.0 - smoothOpacity) * sobelColor.w
            );
        }
        </script>

function createModeButton(label, mode) {

    const button =
        new ThreeMeshUI.Block({
            width: 0.145,
            height: 0.075,
            margin: 0.008,
            justifyContent: 'center',
            alignContent: 'center',
            borderRadius: 0.015,
            backgroundColor:
                new THREE.Color(0x404750),
            backgroundOpacity: 1.0
        });


    const text =
        new ThreeMeshUI.Text({
            content: label,
            fontSize: 0.027,
            fontColor:
                new THREE.Color(0xffffff)
        });


    button.add(text);


    const hitGeometry =
        new THREE.PlaneGeometry(
            0.16,
            0.09
        );


    const hitMaterial =
        new THREE.MeshBasicMaterial({
            transparent: true,
            opacity: 0.0,
            side: THREE.DoubleSide,
            depthWrite: false
        });


    const hitArea =
        new THREE.Mesh(
            hitGeometry,
            hitMaterial
        );


    hitArea.position.z = 0.003;


    THREE.Object3D.prototype.add.call(
        button,
        hitArea
    );


    modeButtons.push({
        object: button,
        hitArea: hitArea,
        mode: mode
    });


    return button;
}



function updateModeButtonVisuals() {

    for (const buttonInfo of modeButtons) {

        const isSelected =
            buttonInfo.mode === currentMode;

        const isHovered =
            buttonInfo.mode === hoveredMode;


        if (isSelected || isHovered) {

            buttonInfo.object.set({
                backgroundColor:
                    new THREE.Color(0xff8800)
            });

        } else {

            buttonInfo.object.set({
                backgroundColor:
                    new THREE.Color(0x404750)
            });
        }
    }
}



function getHoveredModeButton(controller) {

    controller.updateMatrixWorld(true);


    if (modePanel != null) {
        modePanel.updateMatrixWorld(true);
    }


    uiRayMatrix.identity().extractRotation(
        controller.matrixWorld
    );


    uiRaycaster.ray.origin.setFromMatrixPosition(
        controller.matrixWorld
    );


    uiRaycaster.ray.direction
        .set(0, 0, -1)
        .applyMatrix4(uiRayMatrix)
        .normalize();


    let closestButton = null;
    let closestDistance = Infinity;


    for (const buttonInfo of modeButtons) {

        buttonInfo.hitArea.updateMatrixWorld(true);


        const intersections =
            uiRaycaster.intersectObject(
                buttonInfo.hitArea,
                false
            );


        if (
            intersections.length > 0 &&
            intersections[0].distance < closestDistance
        ) {

            closestDistance =
                intersections[0].distance;

            closestButton =
                buttonInfo;
        }
    }


    return closestButton;
}



function isPointerOverModePanel(controller) {

    if (
        menuHitArea == null ||
        modePanel == null
    ) {
        return false;
    }


    controller.updateMatrixWorld(true);
    modePanel.updateMatrixWorld(true);
    menuHitArea.updateMatrixWorld(true);


    uiRayMatrix.identity().extractRotation(
        controller.matrixWorld
    );


    uiRaycaster.ray.origin.setFromMatrixPosition(
        controller.matrixWorld
    );


    uiRaycaster.ray.direction
        .set(0, 0, -1)
        .applyMatrix4(uiRayMatrix)
        .normalize();


    const intersections =
        uiRaycaster.intersectObject(
            menuHitArea,
            false
        );


    return intersections.length > 0;
}

function handleLocalImage(event) {

    const file =
        event.target.files[0];


    if (file == null) {
        return;
    }


    if (!file.type.startsWith("image/")) {

        alert(
            "O arquivo selecionado não é uma imagem."
        );

        return;
    }


    const localImageUrl =
        URL.createObjectURL(file);


    const poitaImagePreview =
        document.getElementById(
            "poitaImagePreview"
        );


    const poitaImageScreen =
        document.getElementById(
            "poitaImageScreen"
        );


    const poitaReadyScreen =
        document.getElementById(
            "poitaReadyScreen"
        );


    poitaImagePreview.src =
        localImageUrl;


    replaceImage(
        localImageUrl
    );


    poitaImageScreen.classList.add(
        "poitaHidden"
    );


    poitaReadyScreen.classList.remove(
        "poitaHidden"
    );
}



function replaceImage(url) {

    if (imagePlane != null) {

        group.remove(
            imagePlane
        );


        if (imagePlane.geometry) {

            imagePlane.geometry.dispose();
        }


        if (imagePlane.material) {

            if (
                imagePlane.material.uniforms &&
                imagePlane.material.uniforms.colorTexture
            ) {

                const oldTexture =
                    imagePlane.material.uniforms
                        .colorTexture.value;


                if (oldTexture) {

                    oldTexture.dispose();
                }
            }


            imagePlane.material.dispose();
        }


        imagePlane = null;
    }


    const length = 0.25;


    loadTexture(
        group,
        length,
        url
    );
}

function loadTexture(container, length, url) {

    const loader =
        new THREE.TextureLoader();


    loader.load(

        url,

        function (texture) {

            if (
                document.getElementById(
                    "ARButton"
                ) == null
            ) {

                document.body.appendChild(
                    ARButton.createButton(
                        renderer
                    )
                );
            }


            let originalWidth =
                texture.image.width;

            let originalHeight =
                texture.image.height;


            let max =
                Math.max(
                    originalWidth,
                    originalHeight
                );


            let width =
                (originalWidth / max) *
                length;


            let height =
                (originalHeight / max) *
                length;


            const geometry =
                new THREE.PlaneGeometry(
                    width,
                    height
                );


            texture.generateMipmaps =
                false;


            const sobelMaterial =
                new THREE.ShaderMaterial({

                    transparent: true,

                    side:
                        THREE.DoubleSide,

                    uniforms: {

                        colorTexture: {
                            value: texture
                        },

                        opacity: {
                            value: currentOpacity
                        }
                    },

                    vertexShader:
                        document.getElementById(
                            'vertexshader'
                        ).textContent,

                    fragmentShader:
                        document.getElementById(
                            'fragmentshader'
                        ).textContent
                });


            imagePlane =
                new THREE.Mesh(
                    geometry,
                    sobelMaterial
                );


            container.add(
                imagePlane
            );
        },


        undefined,


        function (err) {

            alert(
                "Unable to load image, try a different URL.\n\n" +
                "Cross-Origin Resource Sharing (CORS) policies might " +
                "prevent the app from loading images from certain websites."
            );
        }
    );
}



function incrementOpacity(delta) {

    currentOpacity +=
        delta;


    currentOpacity =
        Math.min(
            Math.max(
                currentOpacity,
                0.0
            ),
            1.0
        );


    if (imagePlane != null) {

        imagePlane.material
            .uniforms["opacity"]
            .value =
                currentOpacity;
    }
}



function incrementScale(delta) {

    const scaleSpeed =
        Math.max(
            currentScale,
            1.0
        );


    currentScale +=
        delta *
        scaleSpeed;


    currentScale =
        Math.min(
            Math.max(
                currentScale,
                0.0
            ),
            40.0
        );


    if (group != null) {

        group.scale.set(
            currentScale,
            currentScale,
            currentScale
        );
    }
}



function moveImage(axis, delta) {

    if (group == null) {
        return;
    }


    const moveSpeed =
        0.35;


    const distance =
        delta *
        moveSpeed;


    if (axis === "x") {

        group.translateX(
            distance
        );

    } else if (axis === "y") {

        group.translateY(
            distance
        );

    } else if (axis === "z") {

        group.translateZ(
            distance
        );
    }
}



function onWindowResize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}



function animate() {

    renderer.setAnimationLoop(
        loop
    );
}



function loop() {

    ThreeMeshUI.update();


    if (modePanel != null) {

        modePanel.updateMatrixWorld(
            true
        );
    }


    updateInput();


    renderer.render(
        scene,
        camera
    );
}



function updateInput() {

    const xrSession =
        renderer.xr.getSession();


    const elapsedTime =
        clock.getDelta();


    let didPressHideImage =
        false;


    hoveredMode =
        null;


    if (
        xrSession == null ||
        xrSession.inputSources.length <= 0
    ) {

        return;
    }


    for (
        let i = 0;
        i < xrSession.inputSources.length;
        i++
    ) {

        const input =
            xrSession.inputSources[i];


        const gamepad =
            input.gamepad;


        if (
            gamepad != null &&
            gamepad.mapping == "xr-standard" &&
            gamepad.axes.length >= 4
        ) {

            const horizontal =
                gamepad.axes[2];


            const vertical =
                gamepad.axes[3];


            const triggerButton =
                gamepad.buttons[0];


            const axButton =
                gamepad.buttons[4];


            if (
                currentMode === "scale"
            ) {

                if (
                    vertical > 0.7
                ) {

                    incrementScale(
                        -1.0 *
                        elapsedTime
                    );

                } else if (
                    vertical < -0.7
                ) {

                    incrementScale(
                        1.0 *
                        elapsedTime
                    );
                }


                if (
                    horizontal > 0.7
                ) {

                    incrementOpacity(
                        1.0 *
                        elapsedTime
                    );

                } else if (
                    horizontal < -0.7
                ) {

                    incrementOpacity(
                        -1.0 *
                        elapsedTime
                    );
                }


            } else if (
                currentMode === "x"
            ) {

                if (
                    horizontal > 0.25
                ) {

                    moveImage(
                        "x",
                        elapsedTime
                    );

                } else if (
                    horizontal < -0.25
                ) {

                    moveImage(
                        "x",
                        -elapsedTime
                    );
                }


            } else if (
                currentMode === "y"
            ) {

                if (
                    vertical < -0.25
                ) {

                    moveImage(
                        "y",
                        elapsedTime
                    );

                } else if (
                    vertical > 0.25
                ) {

                    moveImage(
                        "y",
                        -elapsedTime
                    );
                }


            } else if (
                currentMode === "z"
            ) {

                if (
                    vertical < -0.25
                ) {

                    moveImage(
                        "z",
                        -elapsedTime
                    );

                } else if (
                    vertical > 0.25
                ) {

                    moveImage(
                        "z",
                        elapsedTime
                    );
                }
            }


            const controllerToUse =
                renderer.xr.getController(
                    i
                );


            const hoveredModeButton =
                getHoveredModeButton(
                    controllerToUse
                );


            const pointerOverModePanel =
                isPointerOverModePanel(
                    controllerToUse
                );


            if (
                hoveredModeButton != null
            ) {

                hoveredMode =
                    hoveredModeButton.mode;
            }


            const triggerJustPressed =
                triggerButton.pressed &&
                !previousTriggerPressed[i];


            if (
                hoveredModeButton != null &&
                triggerJustPressed
            ) {

                currentMode =
                    hoveredModeButton.mode;


                updateModeButtonVisuals();


                console.log(
                    "POITA modo:",
                    currentMode
                );
            }


            if (
                !pointerOverModePanel &&
                triggerButton.pressed
            ) {

                const offsetPosition =
                    controllerToUse.localToWorld(
                        new THREE.Vector3(
                            0,
                            0,
                            -0.105
                        )
                    );


                group.position.copy(
                    offsetPosition
                );


                group.setRotationFromQuaternion(
                    controllerToUse.quaternion
                );
            }


            previousTriggerPressed[i] =
                triggerButton.pressed;


            if (
                axButton.pressed
            ) {

                didPressHideImage =
                    true;
            }
        }
    }


    updateModeButtonVisuals();


    const shouldChangeImageVisibility =
        (
            !didPressHideImage &&
            previousDidPressHideImage
        );


    previousDidPressHideImage =
        didPressHideImage;


    if (
        shouldChangeImageVisibility &&
        imagePlane != null
    ) {

        imagePlane.visible =
            !imagePlane.visible;
    }
}
