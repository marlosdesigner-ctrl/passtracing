<style>

<script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.147.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.147.0/examples/jsm/",

<script type="x-shader/x-vertex" id="vertexshader">
varying vec2 vUv;

void main() {
    vUv = uv;
    gl_Position =
        projectionMatrix *
        modelViewMatrix *
        vec4(position, 1.0);
}
</script>

<script type="x-shader/x-fragment" id="fragmentshader">
uniform sampler2D colorTexture;
uniform float opacity;

float stepSize = 2.0;
varying vec2 vUv;

float intensity(in vec4 color) {
    return sqrt(
        color.x * color.x +
        color.y * color.y +
        color.z * color.z
    );
}

void main() {
    vec2 uv = vUv;
    ivec2 imageSize = textureSize(colorTexture, 0);

    vec2 step = vec2(
        stepSize / float(imageSize.x),
        stepSize / float(imageSize.y)
    );

    float topLeft = intensity(
        texture2D(colorTexture, uv + vec2(-step.x, step.y))
    );
    float left = intensity(
        texture2D(colorTexture, uv + vec2(-step.x, 0.0))
    );
    float bottomLeft = intensity(
        texture2D(colorTexture, uv + vec2(-step.x, -step.y))
    );
    float top = intensity(
        texture2D(colorTexture, uv + vec2(0.0, step.y))
    );
    float bottom = intensity(
        texture2D(colorTexture, uv + vec2(0.0, -step.y))
    );
    float topRight = intensity(
        texture2D(colorTexture, uv + vec2(step.x, step.y))
    );
    float right = intensity(
        texture2D(colorTexture, uv + vec2(step.x, 0.0))
    );
    float bottomRight = intensity(
        texture2D(colorTexture, uv + vec2(step.x, -step.y))
    );

    float horizontal =
        topLeft + 2.0 * left + bottomLeft -
        topRight - 2.0 * right - bottomRight;

    float vertical =
        -topLeft - 2.0 * top - topRight +
        bottomLeft + 2.0 * bottom + bottomRight;

    float sobelResult = sqrt(
        horizontal * horizontal +
        vertical * vertical
    );

    vec4 sobelColor = vec4(
        1.0 - sobelResult,
        1.0 - sobelResult,
        1.0 - sobelResult,
        sobelResult
    );

    vec4 currentColor = texture2D(colorTexture, uv);
    float smoothOpacity = smoothstep(0.0, 0.3, opacity);

    gl_FragColor = vec4(
        currentColor.x * smoothOpacity +
            (1.0 - smoothOpacity) * sobelColor.x,
        currentColor.y * smoothOpacity +
            (1.0 - smoothOpacity) * sobelColor.y,
        currentColor.z * smoothOpacity +
            (1.0 - smoothOpacity) * sobelColor.z,
        currentColor.w * min(opacity, smoothOpacity) +
            (1.0 - smoothOpacity) * sobelColor.w
    );
}
</script>

<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { ARButton } from 'three/addons/webxr/ARButton.js';
import ThreeMeshUI from 'three-mesh-ui';

let container;
let camera, scene, renderer;
let controller1, controller2;
let clock;

let group = null;
let imagePlane = null;
let instructionsPlane = null;

let currentOpacity = 0.75;
let currentScale = 1.0;
let currentMode = "scale";

// ESTÁGIO 1 - FIXAÇÃO
let imageFixed = false;

let modePanel = null;
let modeButtons = [];
let menuHitArea = null;
let hoveredMode = null;

let previousDidPressHideImage = false;
let previousTriggerPressed = [false, false];

const uiRaycaster = new THREE.Raycaster();
const uiRayMatrix = new THREE.Matrix4();

init();
animate();

function init() {
    container = document.getElementById("container");
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
        50,
        window.innerWidth / window.innerHeight,
        0.1,
        10
    );
    camera.position.set(0, 0, 1);

    const controls = new OrbitControls(camera, container);
    controls.minDistance = 0;
    controls.maxDistance = 8;

    clock = new THREE.Clock();

    renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.localClippingEnabled = true;
    renderer.xr.enabled = true;
    renderer.xr.setFoveation(0);

    container.appendChild(renderer.domElement);

    controller1 = renderer.xr.getController(0);
    controller2 = renderer.xr.getController(1);

    scene.add(controller1);
    scene.add(controller2);

    const rayGeometry =
        new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0, 0, -1)
        ]);

    const rayMaterial = new THREE.LineBasicMaterial({
        color: 0xffffff
    });

    const ray1 = new THREE.Line(rayGeometry, rayMaterial);
    ray1.scale.z = 3;
    controller1.add(ray1);

    const ray2 = ray1.clone();
    controller2.add(ray2);

    makeModeUI();

    group = new THREE.Group();
    group.position.set(0, 0, -0.5);
    scene.add(group);

    loadTexture(group, 0.25, 'Images/discovery.jpg');

    window.addEventListener('resize', onWindowResize);

    const enterPoitaLink =
        document.getElementById("enterPoitaLink");
    const poitaWelcome =
        document.getElementById("poitaWelcome");
    const poitaImageScreen =
        document.getElementById("poitaImageScreen");
    const poitaReadyScreen =
        document.getElementById("poitaReadyScreen");
    const startPoitaLink =
        document.getElementById("startPoitaLink");
    const changePoitaImageLink =
        document.getElementById("changePoitaImageLink");
    const localImageLink =
        document.getElementById("localImageLink");
    const imageFileInput =
        document.getElementById("imageFileInput");

    enterPoitaLink.onclick = function(event) {
        event.preventDefault();
        poitaWelcome.classList.add("poitaHidden");
        poitaImageScreen.classList.remove("poitaHidden");
    };

    localImageLink.onclick = function(event) {
        event.preventDefault();
        imageFileInput.value = "";
        imageFileInput.click();
    };

    imageFileInput.onchange = handleLocalImage;

    changePoitaImageLink.onclick = function(event) {
        event.preventDefault();
        imageFileInput.value = "";
        imageFileInput.click();
    };

    startPoitaLink.onclick = function(event) {
        event.preventDefault();

        const arButton = document.getElementById("ARButton");

        if (arButton != null) {
            poitaReadyScreen.classList.add("poitaHidden");
            arButton.click();
        }
    };
}

// =======================================
// INTERFACE DE CONTROLE
// =======================================

function makeModeUI() {
    const fontFamily =
        'https://unpkg.com/three-mesh-ui@6.5.2/examples/assets/Roboto-msdf.json';

    const fontTexture =
        'https://unpkg.com/three-mesh-ui@6.5.2/examples/assets/Roboto-msdf.png';

    modePanel = new ThreeMeshUI.Block({
        width: 0.99,
        height: 0.22,
        padding: 0.025,
        contentDirection: 'column',
        justifyContent: 'center',
        alignContent: 'center',
        borderRadius: 0.025,
        backgroundColor: new THREE.Color(0x20252b),
        backgroundOpacity: 0.90,
        fontFamily: fontFamily,
        fontTexture: fontTexture
    });

    modePanel.position.set(0.15, 0.10, -0.04);
    modePanel.scale.set(0.27, 0.27, 0.27);

    menuHitArea = new THREE.Mesh(
        new THREE.PlaneGeometry(1.02, 0.25),
        new THREE.MeshBasicMaterial({
            transparent: true,
            opacity: 0,
            side: THREE.DoubleSide,
            depthWrite: false
        })
    );

    menuHitArea.position.z = 0.001;

    THREE.Object3D.prototype.add.call(
        modePanel,
        menuHitArea
    );

    const title = new ThreeMeshUI.Text({
        content: "POITA  •  CONTROLE",
        fontSize: 0.032,
        fontColor: new THREE.Color(0xffffff)
    });

    const buttonRow = new ThreeMeshUI.Block({
        width: 0.94,
        height: 0.10,
        margin: 0.015,
        contentDirection: 'row',
        justifyContent: 'center',
        alignContent: 'center',
        backgroundOpacity: 0
    });

    buttonRow.add(
        createModeButton("ESCALA", "scale"),
        createModeButton("X", "x"),
        createModeButton("Y", "y"),
        createModeButton("Z", "z"),
        createModeButton("FIXAR", "fix")
    );

    modePanel.add(title, buttonRow);
    controller1.add(modePanel);

    updateModeButtonVisuals();
}

function createModeButton(label, mode) {
    const width = mode === "fix" ? 0.22 : 0.155;

    const button = new ThreeMeshUI.Block({
        width: width,
        height: 0.075,
        margin: 0.008,
        justifyContent: 'center',
        alignContent: 'center',
        borderRadius: 0.015,
        backgroundColor: new THREE.Color(0x404750),
        backgroundOpacity: 1
    });

    const labelText = new ThreeMeshUI.Text({
        content: label,
        fontSize: mode === "fix" ? 0.023 : 0.027,
        fontColor: new THREE.Color(0xffffff)
    });

    button.add(labelText);

    const hitArea = new THREE.Mesh(
        new THREE.PlaneGeometry(width + 0.01, 0.09),
        new THREE.MeshBasicMaterial({
            transparent: true,
            opacity: 0,
            side: THREE.DoubleSide,
            depthWrite: false
        })
    );

    hitArea.position.z = 0.003;

    THREE.Object3D.prototype.add.call(
        button,
        hitArea
    );

    modeButtons.push({
        object: button,
        hitArea: hitArea,
        text: labelText,
        mode: mode
    });

    return button;
}

// =======================================
// VISUAL FIXAR / DESAFIXAR
// =======================================

function updateModeButtonVisuals() {
    for (const info of modeButtons) {

        if (info.mode === "fix") {
            const desiredLabel =
                imageFixed ? "DESAFIXAR" : "FIXAR";

            if (info.displayLabel !== desiredLabel) {
                info.text.set({
                    content: desiredLabel
                });
                info.displayLabel = desiredLabel;
            }

            info.object.set({
                backgroundColor: new THREE.Color(
                    imageFixed ? 0x267d59 : 0xff8800
                ),
                backgroundOpacity: 1
            });

        } else if (imageFixed) {

            info.object.set({
                backgroundColor: new THREE.Color(0x404750),
                backgroundOpacity: 0.25
            });

        } else {

            const active =
                info.mode === currentMode ||
                info.mode === hoveredMode;

            info.object.set({
                backgroundColor: new THREE.Color(
                    active ? 0xff8800 : 0x404750
                ),
                backgroundOpacity: 1
            });
        }
    }
}

// =======================================
// DETECÇÃO DOS BOTÕES
// =======================================

function getHoveredModeButton(controller) {
    controller.updateMatrixWorld(true);

    if (modePanel != null) {
        modePanel.updateMatrixWorld(true);
    }

    uiRayMatrix.identity().extractRotation(
        controller.matrixWorld
    );

    uiRaycaster.ray.origin.setFromMatrixPosition(
        controller.matrixWorld
    );

    uiRaycaster.ray.direction
        .set(0, 0, -1)
        .applyMatrix4(uiRayMatrix)
        .normalize();

    let closestButton = null;
    let closestDistance = Infinity;

    for (const info of modeButtons) {
        info.hitArea.updateMatrixWorld(true);

        const intersections = uiRaycaster.intersectObject(
            info.hitArea,
            false
        );

        if (
            intersections.length > 0 &&
            intersections[0].distance < closestDistance
        ) {
            closestDistance = intersections[0].distance;
            closestButton = info;
        }
    }

    if (
        imageFixed &&
        closestButton != null &&
        closestButton.mode !== "fix"
    ) {
        return null;
    }

    return closestButton;
}

function isPointerOverModePanel(controller) {
    if (menuHitArea == null || modePanel == null) {
        return false;
    }

    controller.updateMatrixWorld(true);
    modePanel.updateMatrixWorld(true);
    menuHitArea.updateMatrixWorld(true);

    uiRayMatrix.identity().extractRotation(
        controller.matrixWorld
    );

    uiRaycaster.ray.origin.setFromMatrixPosition(
        controller.matrixWorld
    );

    uiRaycaster.ray.direction
        .set(0, 0, -1)
        .applyMatrix4(uiRayMatrix)
        .normalize();

    return uiRaycaster.intersectObject(
        menuHitArea,
        false
    ).length > 0;
}

// =======================================
// CARREGAMENTO DE IMAGEM
// =======================================

function handleLocalImage(event) {
    const file = event.target.files[0];

    if (file == null) return;

    if (!file.type.startsWith("image/")) {
        alert("O arquivo selecionado não é uma imagem.");
        return;
    }

    const localImageUrl = URL.createObjectURL(file);

    document.getElementById(
        "poitaImagePreview"
    ).src = localImageUrl;

    replaceImage(localImageUrl);

    document.getElementById(
        "poitaImageScreen"
    ).classList.add("poitaHidden");

    document.getElementById(
        "poitaReadyScreen"
    ).classList.remove("poitaHidden");
}

function replaceImage(url) {
    if (imagePlane != null) {
        group.remove(imagePlane);

        if (imagePlane.geometry) {
            imagePlane.geometry.dispose();
        }

        if (imagePlane.material) {
            const uniforms = imagePlane.material.uniforms;

            if (uniforms && uniforms.colorTexture) {
                const oldTexture = uniforms.colorTexture.value;
                if (oldTexture) oldTexture.dispose();
            }

            imagePlane.material.dispose();
        }

        imagePlane = null;
    }

    loadTexture(group, 0.25, url);
}

function loadTexture(container, length, url) {
    const loader = new THREE.TextureLoader();

    loader.load(
        url,
        function(texture) {

            if (document.getElementById("ARButton") == null) {
                document.body.appendChild(
                    ARButton.createButton(renderer)
                );
            }

            const originalWidth = texture.image.width;
            const originalHeight = texture.image.height;

            const max = Math.max(
                originalWidth,
                originalHeight
            );

            const width = (originalWidth / max) * length;
            const height = (originalHeight / max) * length;

            const geometry = new THREE.PlaneGeometry(
                width,
                height
            );

            texture.generateMipmaps = false;

            const sobelMaterial = new THREE.ShaderMaterial({
                transparent: true,
                side: THREE.DoubleSide,
                uniforms: {
                    colorTexture: {
                        value: texture
                    },
                    opacity: {
                        value: currentOpacity
                    }
                },
                vertexShader: document.getElementById(
                    "vertexshader"
                ).textContent,
                fragmentShader: document.getElementById(
                    "fragmentshader"
                ).textContent
            });

            imagePlane = new THREE.Mesh(
                geometry,
                sobelMaterial
            );

            container.add(imagePlane);
        },
        undefined,
        function(error) {
            console.error("POITA: erro ao carregar imagem", error);
            alert(
                "Não foi possível carregar a imagem. " +
                "Verifique o arquivo ou endereço."
            );
        }
    );
}

// =======================================
// TRANSFORMAÇÕES DA IMAGEM
// =======================================

function incrementOpacity(delta) {
    if (imageFixed) return;

    currentOpacity += delta;

    currentOpacity = Math.min(
        Math.max(currentOpacity, 0),
        1
    );

    if (imagePlane != null) {
        imagePlane.material.uniforms.opacity.value =
            currentOpacity;
    }
}

function incrementScale(delta) {
    if (imageFixed) return;

    const scaleSpeed = Math.max(currentScale, 1);

    currentScale += delta * scaleSpeed;

    currentScale = Math.min(
        Math.max(currentScale, 0),
        40
    );

    if (group != null) {
        group.scale.set(
            currentScale,
            currentScale,
            currentScale
        );
    }
}

function moveImage(axis, delta) {
    if (imageFixed || group == null) return;

    const distance = delta * 0.35;

    if (axis === "x") {
        group.translateX(distance);
    } else if (axis === "y") {
        group.translateY(distance);
    } else if (axis === "z") {
        group.translateZ(distance);
    }
}

// =======================================
// RENDERIZAÇÃO
// =======================================

function onWindowResize() {
    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}

function animate() {
    renderer.setAnimationLoop(loop);
}

function loop() {
    ThreeMeshUI.update();

    if (modePanel != null) {
        modePanel.updateMatrixWorld(true);
    }

    updateInput();

    renderer.render(scene, camera);
}

// =======================================
// CONTROLES META QUEST 2
// =======================================

function updateInput() {
    const session = renderer.xr.getSession();
    const dt = clock.getDelta();

    hoveredMode = null;

    if (!session) return;

    let hideImagePressed = false;
    const sources = session.inputSources;

    for (let i = 0; i < sources.length; i++) {
        const gamepad = sources[i].gamepad;

        if (
            !gamepad ||
            gamepad.mapping !== "xr-standard"
        ) {
            continue;
        }

        const controller = renderer.xr.getController(i);
        const trigger = gamepad.buttons[0];
        const axButton = gamepad.buttons[4];

        const triggerPressed = Boolean(
            trigger && trigger.pressed
        );

        const justPressed =
            triggerPressed &&
            !previousTriggerPressed[i];

        const overPanel =
            isPointerOverModePanel(controller);

        const hoveredButton =
            getHoveredModeButton(controller);

        if (hoveredButton) {
            hoveredMode = hoveredButton.mode;
        }

        // CLIQUE DOS BOTÕES
        if (justPressed && hoveredButton) {

            if (hoveredButton.mode === "fix") {
                imageFixed = !imageFixed;

                console.log(
                    imageFixed
                        ? "POITA: IMAGEM FIXADA"
                        : "POITA: IMAGEM DESAFIXADA"
                );

            } else if (!imageFixed) {
                currentMode = hoveredButton.mode;

                console.log(
                    "POITA modo:",
                    currentMode
                );
            }
        }

        // ANALÓGICOS SOMENTE QUANDO DESAFIXADO
        if (!imageFixed && gamepad.axes.length >= 4) {

            const horizontal = gamepad.axes[2];
            const vertical = gamepad.axes[3];

            if (currentMode === "scale") {

                if (vertical > 0.7) {
                    incrementScale(-dt);
                } else if (vertical < -0.7) {
                    incrementScale(dt);
                }

                if (horizontal > 0.7) {
                    incrementOpacity(dt);
                } else if (horizontal < -0.7) {
                    incrementOpacity(-dt);
                }

            } else if (currentMode === "x") {

                if (horizontal > 0.25) {
                    moveImage("x", dt);
                } else if (horizontal < -0.25) {
                    moveImage("x", -dt);
                }

            } else if (currentMode === "y") {

                if (vertical < -0.25) {
                    moveImage("y", dt);
                } else if (vertical > 0.25) {
                    moveImage("y", -dt);
                }

            } else if (currentMode === "z") {

                if (vertical < -0.25) {
                    moveImage("z", -dt);
                } else if (vertical > 0.25) {
                    moveImage("z", dt);
                }
            }
        }

        // REPOSICIONAMENTO PELO GATILHO
        // BLOQUEADO QUANDO FIXADO
        if (
            !imageFixed &&
            !overPanel &&
            triggerPressed &&
            group
        ) {
            controller.updateMatrixWorld(true);

            const offset = controller.localToWorld(
                new THREE.Vector3(0, 0, -0.105)
            );

            group.position.copy(offset);

            const worldQuaternion =
                new THREE.Quaternion();

            controller.getWorldQuaternion(
                worldQuaternion
            );

            group.setRotationFromQuaternion(
                worldQuaternion
            );
        }

        previousTriggerPressed[i] = triggerPressed;

        if (axButton && axButton.pressed) {
            hideImagePressed = true;
        }
    }

    updateModeButtonVisuals();

    // MANTÉM MOSTRAR/OCULTAR IMAGEM
    if (
        !hideImagePressed &&
        previousDidPressHideImage &&
        imagePlane
    ) {
        imagePlane.visible = !imagePlane.visible;
    }

    previousDidPressHideImage = hideImagePressed;
}

</script>

        </a>

</div>

    <div class="poitaCard">
        <div class="poitaLogo">POITA</div>
        <div class="poitaSubtitle">MURALLOCK SYSTEM</div>
        <a href="#" id="localImageLink" class="poitaButton">

        </a>
    </div>
</div>

     class="poitaScreen poitaHidden">

        <div class="poitaLogo">POITA</div>
        <div class="poitaSubtitle">MURALLOCK SYSTEM</div>

        <div class="poitaPreview">
            <img
                id="poitaImagePreview"
                alt="Imagem selecionada"
            >
        </div>

        <div class="poitaStatus">
            IMAGEM CARREGADA
        </div>

        <a href="#" id="startPoitaLink" class="poitaButton">

        </a>

        <a href="#"
           id="changePoitaImageLink"
           class="poitaSecondaryButton">

        </a>
    </div>
</div>
